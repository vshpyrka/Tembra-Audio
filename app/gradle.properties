org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4G
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The app's version name, shown by Android and as the Google Play release name. Bump it by hand when a release deserves
# a new one; the Play workflow appends the build number: "0.1.0 (370)" (docs/google-play-publishing.md).
tembra.versionName=0.1.0
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.binary.gc=cms
kotlin.incremental.native=true
kotlin.apple.xcodeCompatibility.nowarn=true
