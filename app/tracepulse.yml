# Tembra Audio performance pipeline configuration (feature 007).
# Read by `uv run tracepulse …` from app/perf/. Contract: specs/007-performance-pipeline/contracts/cli.md.
# Unknown keys are an error (exit 4). Device entries are added automatically on first run.

# Detection parameters: the validated trace-pulse defaults, unchanged.
# Screening gates per metric come from the catalogue (app/perf/tracepulse/catalogue.py);
# override one here under detection.screening_gates.min_delta_pct / min_delta_abs.
detection: { width: 5, threshold: 15, min_sd: 0.001, min_history: 11 }
confirm:   { rounds_per_side: 2, q: 0.05 }
apk:       { min_delta_pct: 0.5 }
ab:        { p_different: 0.05, p_same: 0.10, max_baseline_rounds: 2 }
quality:
  cov_max: 0.15
  # Honestly noisy within a round while their round medians stay stable (Pixel 6 Pro, seven rounds 2026-10-08/11):
  # TTFD (bimodal cold-start content timing), the frame count of the tuner journey (it waits on anchors, 0.55-0.68)
  # and the tuner journey's own duration (0.16-0.21, the same anchor waits). Section keys are never part of this
  # badge (see collect_android.quality_flags). The end-of-journey heap size carried 0.55 until the noise baseline
  # showed its round medians swing 4-16 % (GC timing); it is resident anonymous memory since 2026-10-11.
  cov_max_overrides: { timeToFullDisplayMs: 0.45, frameCount: 0.75, journey.tunerSumMs: 0.25 }
  battery_temp_max_c: 35.0
  battery_min_level: 50
suite_spike: { min_dimensions: 3 }
collection: { iterations: 20, session_rounds: 5 }
history:   { branch: perf-history, remote: origin, worktree: perf/.history }

gate:
  clean_rounds: 5
  # Overrides of the catalogue's per-metric defaults (startup 15, memory 15, app size 2,
  # sections 20, frames 25, audio 50). A key must exist in the catalogue.
  limits_pct: { startup.ttid_ms: 15, memory.peak_kb: 15, app.size_bytes: 2 }
  simulators: inactive

# Labels of measurement experiments: the overview page never compares a feature with one of these.
report: { experiment_labels: [noise-baseline, release-baseline] }

devices:
  e9446ac2: { platform: android, model: "Redmi Note 5", kind: device, reference: true }
  3621105H803UFX: { platform: android, model: "Pixel Tablet", kind: device, reference: true }
  # The Pixel 7 Pro charges at 100 % on the owner's hub and sat at 36-39 C between rounds of the 010 session
  # (2026-11-05), so 35 C refused round after round; 40 C as on the Pixel 6 Pro.
  33241FDH3000NZ: { platform: android, model: "Pixel 7 Pro", kind: device, reference: true, overrides: { battery_temp_max_c: 40.0 } }
  O7PBYLZP4HMBW8S4: { platform: android, model: "CPH2239", kind: device, reference: true }
  19021FDEE001AH: { platform: android, model: Pixel 6 Pro, alias: pixel6, overrides: { battery_temp_max_c: 40.0 } }
  00008110-001049660E3A401E: { platform: ios, model: iPhone 14, alias: iphone14 }
  4CD6879C-8FBA-4CEF-B4EC-31968D0144B0: { platform: ios, model: "iPhone 17 (simulator)", kind: simulator, reference: false }

android:
  package: com.tembraaudio
  activity: audio.tembra.android.MainActivity
  build_type: perf
  benchmarks_module: ":perf-benchmarks"
  test_package: audio.tembra.perf
  adb: adb

ios:
  project: iosApp/iosApp.xcodeproj
  scheme: TembraPerf
  configuration: Perf
  bundle_id: com.tembraaudio          # team suffix appended from Config.xcconfig at run time
  test_target: TembraPerfTests
  size_variant: iPhone14,7

# The order an Android round runs them in (an iOS round runs the whole test target in XCTest's order). `stress` stays
# last: the project it builds is then the last edited and sorts first in Projects, so a journey after it that opens the
# demo on a phone in landscape (one card on screen) scrolls to it, about 3 s an iteration (windowing, 2026-11-13).
journeys: [startup, tuner, metronome, timeline, recording, mixer, windowing, stress]
