[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracepulse"
version = "0.2.0"
description = "Tembra Audio performance pipeline: rounds, history, detection, gate and report for Android and iOS"
requires-python = ">=3.9,<3.14"
dependencies = [
    "PyYAML>=6",
    "scipy>=1.13.1,<2",
    "perfetto==0.57.2",
    "Jinja2>=3,<4",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tracepulse = "tracepulse.__main__:main"

[tool.setuptools.packages.find]
include = ["tracepulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: needs an attached device and a full build; skipped unless TRACEPULSE_FULL=1"]

[dependency-groups]
dev = ["pytest>=7"]
