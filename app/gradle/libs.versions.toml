# Tembra Audio version catalog. Every version and library used by any module lives here
# (spec FR-009). Evidence for each pin: specs/001-project-scaffold/research.md R2.
[versions]
kotlin = "2.4.21"
agp = "9.3.3"
compose-multiplatform = "1.12.1"
# Material 3 is published on its own track. Experiment: 1.12.0-alpha03 is the newest JetBrains build on Compose 1.12
# (it ports androidx material3 1.5.0-alpha22 to iOS); Android is pinned to androidx 1.5.0-beta01 below.
compose-material3 = "1.12.0-alpha03"
# The androidx Material 3 Expressive beta used on Android (no JetBrains build of it yet).
androidx-compose-material3 = "1.5.0-beta01"
androidx-lifecycle = "2.11.0"
# Navigation 3 multiplatform (JetBrains artifact paired with Compose Multiplatform 1.12.1): specs/002-adaptive-navigation-shell/research.md R11.
androidx-navigation3 = "1.1.2"
# Material 3 adaptive (currentWindowAdaptiveInfo, window size classes), the stable pairing for material3 1.9.0: research R11.
compose-material3-adaptive = "1.2.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
# Persistent collections for the project document and its undo history (feature 009, research R19).
kotlinx-collections-immutable = "0.4.0"
# Local date-time for the Projects library's relative times (feature 009, FR-051).
kotlinx-datetime = "0.7.1"
metro = "1.4.4"
androidx-activity = "1.13.0"
androidx-compose = "1.12.1"
androidx-test-runner = "1.7.0"
# ServiceTestRule for the metronome foreground service test (feature 004, T042): released with runner 1.7.0.
androidx-test-rules = "1.7.0"
androidx-test-espresso = "3.7.0"
oboe = "1.11.0"
# DataStore Preferences multiplatform for the tuner's remembered choices (feature 003, research R13).
androidx-datastore = "1.3.0"
# Okio, a direct dependency of :shared:data (feature 004, research R16); DataStore 1.3.0 needs 3.17.0 or newer.
okio = "3.18.2"
# Performance pipeline (feature 007): Jetpack Macrobenchmark and UiAutomator for :perf-benchmarks (test module only).
androidx-benchmark = "1.5.0"
# Installs the shipped baseline profile on direct installs and backs the comparison's Partial(Require) state (feature 008, D4).
androidx-profileinstaller = "1.4.1"
androidx-uiautomator = "2.3.0"
androidx-test-ext-junit = "1.3.0"
androidx-tracing = "1.3.0"
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"
android-ndk = "29.0.14206865"
cmake = "3.31.6"

[libraries]
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# Navigation 3 NavDisplay / Scene / SceneStrategy (feature 002, research R11)
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
# Entry-scoped ViewModel decorator for Navigation 3 (feature 002, research R11)
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
# currentWindowAdaptiveInfo() and WindowSizeClass (feature 002, research R11)
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-material3-adaptive" }
# NavigationSuiteScaffoldLayout: bar-versus-rail placement (feature 002, research R11)
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-material3" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }
androidx-compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "androidx-compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Persistent collections for the project document (feature 009, research R19).
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# The JUnit 4 variant of kotlin-test for :androidApp's host test (feature 008): a plain Android module has no
# commonTest, so the Kotlin plugin's framework inference does not pick it (the KMP modules get it automatically).
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
metrox-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-compose-ui-test-junit4-android = { module = "androidx.compose.ui:ui-test-junit4-android", version.ref = "androidx-compose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
oboe = { module = "com.google.oboe:oboe", version.ref = "oboe" }
# Macrobenchmark journeys over the perf anchors (feature 007); never shipped in the app.
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
# `trace("journey.<name>") { }` around each measured journey in the benchmark process (feature 007).
androidx-tracing-ktx = { module = "androidx.tracing:tracing-ktx", version.ref = "androidx-tracing" }
# The one shipped dependency of feature 008: writes the APK's baseline profile into ART's profile directory on the first launch.
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
# DataStore Preferences core (multiplatform; pulls datastore-core-okio and Okio 3.x): feature 003, research R13.
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }
# Okio: the metronome's custom-click file store (feature 004, research R16); FakeFileSystem in tests only.
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }

# Gradle plugin artifacts consumed by build-logic (convention plugins)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
metro-gradle-plugin = { module = "dev.zacsweers.metro:gradle-plugin", version.ref = "metro" }
# The kotlinx.serialization compiler plugin shares KGP's classloader through build-logic (feature 009); modules apply it by id.
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
# Baseline Profile Gradle plugin (feature 008, D1): on build-logic's classpath beside AGP (it compiles against AGP's API),
# applied as `androidx.baselineprofile` by :androidApp (consumer) and :perf-benchmarks (producer).
baselineprofile-gradle-plugin = { module = "androidx.benchmark:benchmark-baseline-profile-gradle-plugin", version.ref = "androidx-benchmark" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidTest = { id = "com.android.test", version.ref = "agp" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
