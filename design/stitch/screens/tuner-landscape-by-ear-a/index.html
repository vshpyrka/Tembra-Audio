<script>
  // Micro-interaction handlers for Audition string pad selections
  const cards = document.querySelectorAll('.string-card');
  const hudNote = document.getElementById('hud-note-name');
  const hudFreq = document.getElementById('hud-freq');
  const hudString = document.getElementById('hud-string-id');
  const toggleBtn = document.getElementById('toggle-tone-btn');
  let isPlaying = true;

  cards.forEach(card => {
    card.addEventListener('click', () => {
      // Clear previous active states
      cards.forEach(c => {
        c.classList.remove('active-card', 'bg-surface-container-high', 'ring-1', 'ring-secondary/50', 'shadow-[0_0_12px_rgba(255,175,211,0.2)]');
        c.classList.add('bg-surface-container');
        const num = c.querySelector('.font-label-sm');
        num.classList.remove('text-secondary', 'font-bold');
        num.classList.add('text-outline-variant', 'font-medium');
        const btn = c.querySelector('button');
        btn.className = "w-full py-1 rounded-md bg-surface-container-highest text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm flex items-center justify-center gap-1";
        btn.innerHTML = `<span class="material-symbols-outlined text-[12px]">play_arrow</span><span>Audition</span>`;
      });

      // Set clicked card to active
      card.classList.add('active-card', 'bg-surface-container-high', 'ring-1', 'ring-secondary/50', 'shadow-[0_0_12px_rgba(255,175,211,0.2)]');
      card.classList.remove('bg-surface-container');
      const activeNum = card.querySelector('.font-label-sm');
      activeNum.classList.add('text-secondary', 'font-bold');
      activeNum.classList.remove('text-outline-variant', 'font-medium');

      const activeBtn = card.querySelector('button');
      activeBtn.className = "w-full py-1 rounded-md bg-secondary-container text-on-secondary-container font-label-sm text-label-sm flex items-center justify-center gap-1 shadow-sm font-bold";
      activeBtn.innerHTML = `<span class="material-symbols-outlined text-[12px] animate-pulse">volume_up</span><span>Playing</span>`;

      // Update HUD
      hudNote.textContent = card.dataset.note;
      hudFreq.textContent = card.dataset.freq;
      hudString.textContent = `STRING ${card.dataset.string}`;

      isPlaying = true;
      toggleBtn.className = "w-full h-8 rounded-lg bg-secondary-container text-on-secondary-container hover:brightness-110 flex items-center justify-center gap-2 font-label-md text-label-md tracking-wider uppercase font-bold shadow-[0_0_14px_rgba(133,20,90,0.6)] transition-all";
      toggleBtn.innerHTML = `<span class="material-symbols-outlined text-[16px]">stop_circle</span><span>Stop Tone Generator</span>`;
    });
  });

  // Toggle start/stop audio state
  toggleBtn.addEventListener('click', () => {
    isPlaying = !isPlaying;
    if (!isPlaying) {
      toggleBtn.className = "w-full h-8 rounded-lg bg-primary text-on-primary hover:brightness-110 flex items-center justify-center gap-2 font-label-md text-label-md tracking-wider uppercase font-bold shadow-md transition-all";
      toggleBtn.innerHTML = `<span class="material-symbols-outlined text-[16px]">play_arrow</span><span>Play Active Tone</span>`;
      cards.forEach(c => {
        const btn = c.querySelector('button');
        if (c.classList.contains('active-card')) {
          btn.innerHTML = `<span class="material-symbols-outlined text-[12px]">pause</span><span>Muted</span>`;
        }
      });
    } else {
      toggleBtn.className = "w-full h-8 rounded-lg bg-secondary-container text-on-secondary-container hover:brightness-110 flex items-center justify-center gap-2 font-label-md text-label-md tracking-wider uppercase font-bold shadow-[0_0_14px_rgba(133,20,90,0.6)] transition-all";
      toggleBtn.innerHTML = `<span class="material-symbols-outlined text-[16px]">stop_circle</span><span>Stop Tone Generator</span>`;
      const activeCard = document.querySelector('.active-card');
      if (activeCard) {
        const btn = activeCard.querySelector('button');
        btn.innerHTML = `<span class="material-symbols-outlined text-[12px] animate-pulse">volume_up</span><span>Playing</span>`;
      }
    }
  });

  const timbreBtns = document.querySelectorAll('.timbre-btn');
