<script class="">
  (function () {
    let bpm = 120;
    let isPlaying = false;
    let currentBeat = 0;
    let totalBeats = 4;
    let intervalId = null;
    let tapTimes = [];
    let isMuted = false;

    const tempoMarkings = [
      { max: 45, text: "Grave (< 45)" },
      { max: 60, text: "Largo (45 - 60)" },
      { max: 76, text: "Adagio (66 - 76)" },
      { max: 108, text: "Andante (76 - 108)" },
      { max: 120, text: "Moderato (108 - 120)" },
      { max: 168, text: "Allegro (120 - 168)" },
      { max: 200, text: "Presto (168 - 200)" },
      { max: 999, text: "Prestissimo (> 200)" }
    ];

    const bpmEl = document.getElementById('bpmValue');
    const tempoMarkingEl = document.getElementById('tempoMarking');
    const playToggleBtn = document.getElementById('playToggleBtn');
    const playIcon = document.getElementById('playIcon');
    const syncPulse = document.getElementById('syncPulse');
    const tapFeedback = document.getElementById('tapFeedback');
    const currentBeatNum = document.getElementById('currentBeatNum');
    const muteBtn = document.getElementById('muteBtn');
    const muteIcon = document.getElementById('muteIcon');
    const podsContainer = document.getElementById('beatPodsContainer');

    function updateTempoText() {
      const entry = tempoMarkings.find(m => bpm <= m.max) || tempoMarkings[tempoMarkings.length - 1];
      tempoMarkingEl.textContent = entry.text;
    }

    function setBpm(val) {
      bpm = Math.min(260, Math.max(30, val));
      bpmEl.textContent = bpm;
      updateTempoText();
      if (isPlaying) {
        restartTimer();
      }
    }

    document.querySelectorAll('.bpm-step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const delta = parseInt(btn.getAttribute('data-delta'), 10);
        setBpm(bpm + delta);
      });
    });

    let audioCtx = null;
    function playClick(isAccent) {
      if (isMuted) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (isAccent) {
          osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.85, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.08);
        } else {
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.05);
        }
      } catch (e) {}
    }

    function triggerBeatVisuals() {
      currentBeat = (currentBeat % totalBeats) + 1;
      if (currentBeatNum) currentBeatNum.textContent = currentBeat;

      const isAccent = (currentBeat === 1);
      playClick(isAccent);

      if (syncPulse) {
        syncPulse.style.transform = 'scale(1.5)';
        syncPulse.style.backgroundColor = isAccent ? '#ffd8e7' : '#cebdff';
        setTimeout(() => {
          syncPulse.style.transform = 'scale(1)';
          syncPulse.style.backgroundColor = '';
        }, 100);
      }

      if (podsContainer) {
        const pods = podsContainer.querySelectorAll('.beat-pod');
        pods.forEach((pod) => {
          const b = parseInt(pod.getAttribute('data-beat'), 10);
          if (b === currentBeat) {
            pod.className = 'beat-pod w-7 h-7 rounded-lg bg-secondary text-[#21005e] font-bold text-xs flex items-center justify-center font-mono shadow-[0_0_8px_#ffafd3] scale-105 transition-transform';
          } else {
            pod.className = 'beat-pod w-7 h-7 rounded-lg bg-[#1e1e26] text-zinc-400 font-bold text-xs flex items-center justify-center font-mono border border-zinc-800 scale-100 transition-transform';
          }
        });
      }
    }

    function startTimer() {
      const intervalMs = (60 / bpm) * 1000;
      currentBeat = 0;
      triggerBeatVisuals();
      intervalId = setInterval(triggerBeatVisuals, intervalMs);
    }

    function stopTimer() {
      clearInterval(intervalId);
      intervalId = null;
      currentBeat = 0;
      if (currentBeatNum) currentBeatNum.textContent = '1';
      if (podsContainer) {
        const pods = podsContainer.querySelectorAll('.beat-pod');
        pods.forEach((pod, idx) => {
          if (idx === 0) {
            pod.className = 'beat-pod w-7 h-7 rounded-lg bg-secondary text-[#21005e] font-bold text-xs flex items-center justify-center font-mono shadow-[0_0_6px_#ffafd3]';
          } else {
            pod.className = 'beat-pod w-7 h-7 rounded-lg bg-[#1e1e26] text-zinc-400 font-bold text-xs flex items-center justify-center font-mono border border-zinc-800';
          }
        });
      }
    }

    function restartTimer() {
      clearInterval(intervalId);
      const intervalMs = (60 / bpm) * 1000;
      intervalId = setInterval(triggerBeatVisuals, intervalMs);
    }

    if (playToggleBtn) {
      playToggleBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playIcon.textContent = 'pause';
          playToggleBtn.classList.remove('from-[#b82a67]', 'to-[#e44d8b]');
          playToggleBtn.classList.add('from-[#85145a]', 'to-[#b82a67]');
          startTimer();
        } else {
          playIcon.textContent = 'play_arrow';
          playToggleBtn.classList.remove('from-[#85145a]', 'to-[#b82a67]');
          playToggleBtn.classList.add('from-[#b82a67]', 'to-[#e44d8b]');
          stopTimer();
        }
      });
    }

    const tapTempoBtn = document.getElementById('tapTempoBtn');
    if (tapTempoBtn) {
      tapTempoBtn.addEventListener('click', () => {
        const now = performance.now();
        tapTimes.push(now);
        if (tapTimes.length > 5) tapTimes.shift();

        if (tapTimes.length > 1) {
          let diffs = [];
          for (let i = 1; i < tapTimes.length; i++) {
            diffs.push(tapTimes[i] - tapTimes[i - 1]);
          }
          const avgDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
          const calculatedBpm = Math.round(60000 / avgDiff);
          if (calculatedBpm >= 30 && calculatedBpm <= 260) {
            setBpm(calculatedBpm);
            if (tapFeedback) tapFeedback.textContent = calculatedBpm + ' BPM';
          }
        } else {
          if (tapFeedback) tapFeedback.textContent = 'TAP...';
        }

        clearTimeout(window.tapResetTimer);
        window.tapResetTimer = setTimeout(() => {
          tapTimes = [];
          if (tapFeedback) tapFeedback.textContent = 'READY';
        }, 2500);
      });
    }

    if (muteBtn) {
      muteBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        muteIcon.textContent = isMuted ? 'volume_off' : 'volume_up';
        muteBtn.classList.toggle('text-rose-400', isMuted);
      });
    }
  })();
</script></main>
