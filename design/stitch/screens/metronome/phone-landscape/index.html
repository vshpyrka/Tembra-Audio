<g transform="rotate(-90 189.5 92)"><circle cx="189.5" cy="92" r="68" fill="none" stroke="#2a2a2d" stroke-width="6" stroke-linecap="round" stroke-dasharray="284.8 427.3"/><circle cx="189.5" cy="92" r="68" fill="none" stroke="url(#ag)" stroke-width="6" stroke-linecap="round" stroke-dasharray="166.2 427.3"/></g><line x1="189.5" y1="22.0" x2="189.5" y2="16.0" stroke="#494552" stroke-width="1.2" opacity=".7"/><line x1="250.1" y1="57.0" x2="255.3" y2="54.0" stroke="#494552" stroke-width="1.2" opacity=".7"/><line x1="250.1" y1="127.0" x2="255.3" y2="130.0" stroke="#494552" stroke-width="1.2" opacity=".7"/><line x1="189.5" y1="162.0" x2="189.5" y2="168.0" stroke="#494552" stroke-width="1.2" opacity=".7"/><line x1="128.9" y1="127.0" x2="123.7" y2="130.0" stroke="#494552" stroke-width="1.2" opacity=".7"/><line x1="128.9" y1="57.0" x2="123.7" y2="54.0" stroke="#494552" stroke-width="1.2" opacity=".7"/></svg>
<button class="bpm-step-btn absolute w-11 h-11 rounded-full bg-[#2a2a2d] text-[#e4e1e6] flex items-center justify-center" style="left:113.5px;top:107px" data-delta="-1"><span class="material-symbols-outlined text-[24px]">remove</span></button>
<button class="bpm-step-btn absolute w-11 h-11 rounded-full bg-[#2a2a2d] text-[#e4e1e6] flex items-center justify-center" style="left:calc(50% + 32px);top:107px" data-delta="1"><span class="material-symbols-outlined text-[24px]">add</span></button>
<div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none" style="top:95px"><span id="bpmValue" class="text-[30px] font-bold leading-none tracking-tight text-[#e4e1e6]">120</span><span class="text-[11px] font-medium text-[#ffafd3] mt-2 leading-none">BPM</span><span id="tempoMarking" class="text-[11px] text-[#cebdff] mt-2 leading-none whitespace-nowrap">Moderato</span></div>
<div class="absolute left-2 right-2 flex items-center gap-2" style="top:270px"><span class="text-[12px] text-[#948e9d]">40</span><input id="tempoSlider" type="range" min="40" max="240" value="120" class="flex-1 h-1.5 rounded-full appearance-none bg-[#353438] accent-[#cebdff]"><span class="text-[12px] text-[#948e9d]">240</span></div>
</div>
<div class="flex items-center gap-2 h-12"><button id="tapTempoBtn" class="flex-1 h-12 rounded-[22px] bg-[#2a2a2d] flex flex-col items-center justify-center"><span class="flex items-center gap-1.5 text-[#cebdff] font-bold text-[17px] leading-none"><span class="material-symbols-outlined text-[20px]">touch_app</span>TAP TEMPO</span><span class="text-[11px] text-[#948e9d] mt-1 leading-none">Sync finger rhythm</span></button>
<button id="playToggleBtn" class="w-12 h-12 rounded-full bg-[#85145a] text-[#ffafd3] flex items-center justify-center shrink-0" style="box-shadow:0 0 8px rgba(255,175,211,.35)"><span id="playIcon" class="material-symbols-outlined text-[30px]" style="font-variation-settings:'FILL' 1">play_arrow</span></button></div>
</main></div></div>
<div class="w-full h-3 flex items-center justify-center bg-[#0e0e11] shrink-0"><div class="w-36 h-1 bg-zinc-600/80 rounded-full"></div></div>
</div>
<script>
(function(){let bpm=120;const b=document.getElementById('bpmValue'),m=document.getElementById('tempoMarking'),s=document.getElementById('tempoSlider');
const T=[[60,'Largo'],[76,'Adagio'],[108,'Andante'],[120,'Moderato'],[168,'Allegro'],[200,'Presto'],[999,'Prestissimo']];
function set(v){bpm=Math.min(240,Math.max(40,v));b.textContent=bpm;s.value=bpm;m.textContent=T.find(t=>bpm<=t[0])[1];}
document.querySelectorAll('.bpm-step-btn').forEach(x=>x.onclick=()=>set(bpm+ +x.dataset.delta));s.oninput=()=>set(+s.value);
let tp=[];document.getElementById('tapTempoBtn').onclick=()=>{const n=performance.now();tp.push(n);if(tp.length>5)tp.shift();if(tp.length>1)set(Math.round(60000/((tp[tp.length-1]-tp[0])/(tp.length-1))));};
let on=false;document.getElementById('playToggleBtn').onclick=()=>{on=!on;document.getElementById('playIcon').textContent=on?'pause':'play_arrow';};})();
</script>
</body></html>
