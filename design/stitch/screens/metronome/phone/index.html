<script>
  (function initMetronome() {
    let bpm = 120;
    let isPlaying = false;
    let currentBeat = 0;
    let totalBeats = 4;
    let timer = null;
    let tapTimes = [];

    const tempoDisplay = document.getElementById('tempoDisplay');
    const tempoTerm = document.getElementById('tempoTerm');
    const tempoRange = document.getElementById('tempoRange');
    const tempoArc = document.getElementById('tempoArc');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const tapTempoBtn = document.getElementById('tapTempoBtn');
    const tapRipple = document.getElementById('tapRipple');
    const tapHelperText = document.getElementById('tapHelperText');
    const activeBarLabel = document.getElementById('activeBarLabel');
    const podsContainer = document.getElementById('beatPodsContainer');

    // Tempo Terms
    function getItalianTerm(value) {
      if (value < 60) return 'Largo (40-59)';
      if (value < 66) return 'Larghetto (60-65)';
      if (value < 76) return 'Adagio (66-75)';
      if (value < 108) return 'Andante (76-107)';
      if (value <= 120) return 'Moderato (108-120)';
      if (value < 168) return 'Allegro (121-167)';
      if (value < 200) return 'Vivace (168-199)';
      return 'Presto (200-240)';
    }

    function updateTempo(newBpm) {
      bpm = Math.max(40, Math.min(240, Math.round(newBpm)));
      tempoDisplay.textContent = bpm;
      tempoRange.value = bpm;
      tempoTerm.textContent = getItalianTerm(bpm);

      // Arc Dash Calculation (range 40-240 mapped to stroke-dasharray)
      const ratio = (bpm - 40) / (240 - 40);
      const strokeLength = Math.round(100 + ratio * 320);
      tempoArc.setAttribute('stroke-dasharray', `${strokeLength} 600`);

      if (isPlaying) {
        restartTimer();
      }
    }

    // Sound Synthesizer via Web Audio API
    let audioCtx = null;
    function playClick(accentLevel) {
      if (accentLevel === 0) return; // Muted

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const now = audioCtx.currentTime;
        if (accentLevel === 2) {
          // High Accent (Loud Woodblock pitch)
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(500, now + 0.04);
          gain.gain.setValueAtTime(0.9, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        } else {
          // Subtle Regular click
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.03);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.07);
      } catch (e) {
        // Fallback or muted sandbox
      }
    }

    function stepBeat() {
      const pods = podsContainer.querySelectorAll('.beat-pod');
      if (!pods.length) return;

      currentBeat = (currentBeat % pods.length);
      const activePod = pods[currentBeat];
      const accent = parseInt(activePod.getAttribute('data-accent') || '1', 10);

      activeBarLabel.textContent = `Beat ${currentBeat + 1} of ${pods.length}`;

      // Flash pod
      pods.forEach((p, idx) => {
        if (idx === currentBeat) {
          p.classList.add('brightness-125', 'scale-[1.03]');
          setTimeout(() => p.classList.remove('brightness-125', 'scale-[1.03]'), 120);
        }
      });

      playClick(accent);
      currentBeat = (currentBeat + 1) % pods.length;
    }

    function restartTimer() {
      if (timer) clearInterval(timer);
      const intervalMs = (60 / bpm) * 1000;
      timer = setInterval(stepBeat, intervalMs);
    }

    function startMetronome() {
      isPlaying = true;
      currentBeat = 0;
      playIcon.textContent = 'pause';
      playPauseBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
      playPauseBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_0_24px_rgba(206,189,255,0.6)]');
      stepBeat();
      restartTimer();
    }

    function stopMetronome() {
      isPlaying = false;
      playIcon.textContent = 'play_arrow';
      playPauseBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_0_24px_rgba(206,189,255,0.6)]');
      playPauseBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopMetronome();
      } else {
        startMetronome();
      }
    });

    document.getElementById('tempoIncBtn').addEventListener('click', () => updateTempo(bpm + 1));
    document.getElementById('tempoDecBtn').addEventListener('click', () => updateTempo(bpm - 1));
    tempoRange.addEventListener('input', (e) => updateTempo(e.target.value));

    // Tap Tempo Calculation
    tapTempoBtn.addEventListener('click', () => {
      const now = performance.now();
      tapTimes.push(now);

      // Visual flash
      tapRipple.classList.remove('opacity-0');
      tapRipple.classList.add('opacity-100');
      setTimeout(() => tapRipple.classList.remove('opacity-100'), 140);

      // Keep only last 4 taps
      if (tapTimes.length > 4) tapTimes.shift();

      if (tapTimes.length >= 2) {
        const diffs = [];
        for (let i = 1; i < tapTimes.length; i++) {
          diffs.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = diffs.reduce((a, b) => a + b) / diffs.length;
        if (avgInterval > 200 && avgInterval < 2000) {
          const calculatedBpm = Math.round(60000 / avgInterval);
          updateTempo(calculatedBpm);
          tapHelperText.textContent = `${calculatedBpm} BPM Detected`;
        }
      }

      clearTimeout(tapTempoBtn._resetTimer);
      tapTempoBtn._resetTimer = setTimeout(() => {
        tapTimes = [];
        tapHelperText.textContent = 'Sync Finger Rhythm';
      }, 2500);
    });

    // Accent Cycling (0 = Mute, 1 = Mid, 2 = High)
    function attachPodListeners() {
      podsContainer.querySelectorAll('.beat-pod').forEach((pod) => {
        pod.addEventListener('click', () => {
          let accent = parseInt(pod.getAttribute('data-accent') || '1', 10);
          accent = (accent + 1) % 3;
          pod.setAttribute('data-accent', accent);

          const badge = pod.querySelector('.accent-badge');
          const bar = pod.querySelector('.indicator-bar');

          if (accent === 2) {
            badge.textContent = 'HIGH';
            badge.className = 'accent-badge font-label-sm text-[9px] px-1 rounded bg-secondary-container text-secondary-fixed';
            bar.className = 'indicator-bar w-full h-8 rounded bg-secondary flex items-end justify-center pb-1 shadow-[0_0_12px_rgba(255,175,211,0.5)] transition-all';
            bar.innerHTML = '<span class="material-symbols-outlined text-[14px] text-on-secondary" style="font-variation-settings: \'FILL\' 1;">volume_up</span>';
          } else if (accent === 1) {
            badge.textContent = 'MID';
            badge.className = 'accent-badge font-label-sm text-[9px] px-1 rounded bg-surface-container-highest text-on-surface-variant';
            bar.className = 'indicator-bar w-full h-4 rounded bg-primary-container flex items-end justify-center pb-0.5 transition-all';
            bar.innerHTML = '<span class="material-symbols-outlined text-[12px] text-on-primary-container" style="font-variation-settings: \'FILL\' 1;">volume_down</span>';
          } else {
            badge.textContent = 'MUTE';
            badge.className = 'accent-badge font-label-sm text-[9px] px-1 rounded bg-surface-container-lowest text-outline';
            bar.className = 'indicator-bar w-full h-1.5 rounded bg-outline-variant flex items-center justify-center transition-all opacity-40';
            bar.innerHTML = '<span class="material-symbols-outlined text-[10px] text-on-surface-variant">volume_off</span>';
          }
        });
      });
    }
    attachPodListeners();

    // Time Signature selection & rebuild pods
    document.querySelectorAll('.meter-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.meter-btn').forEach((b) => {
          b.className = 'meter-btn py-1.5 rounded-lg bg-surface-container-high text-on-surface-variant font-label-md text-label-md font-medium transition-all active:scale-95 hover:text-on-surface';
        });
        btn.className = 'meter-btn py-1.5 rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md font-semibold transition-all active:scale-95 shadow-sm';

        const beats = parseInt(btn.getAttribute('data-beats') || '4', 10);
        totalBeats = beats;
        currentBeat = 0;

        // Rebuild pods
        podsContainer.className = `grid grid-cols-${beats > 5 ? 6 : beats} gap-1.5 h-20`;
        let html = '';
        for (let i = 1; i <= beats; i++) {
          const isHigh = i === 1;
          html += `
            <button class="beat-pod relative flex flex-col items-center justify-between p-2 rounded-lg bg-surface-container-high transition-all active:scale-95 group overflow-hidden" data-accent="${isHigh ? '2' : '1'}" data-beat="${i}">
              <div class="w-full flex justify-between items-center z-10">
                <span class="font-tabular-timecode text-[10px] font-medium text-tertiary">0${i}</span>
                <span class="accent-badge font-label-sm text-[8px] px-1 rounded ${isHigh ? 'bg-secondary-container text-secondary-fixed' : 'bg-surface-container-highest text-on-surface-variant'}">${isHigh ? 'HIGH' : 'MID'}</span>
              </div>
              <div class="indicator-bar w-full ${isHigh ? 'h-8 bg-secondary shadow-[0_0_12px_rgba(255,175,211,0.5)]' : 'h-4 bg-primary-container'} rounded flex items-end justify-center pb-0.5 transition-all">
                <span class="material-symbols-outlined text-[12px] ${isHigh ? 'text-on-secondary' : 'text-on-primary-container'}" style="font-variation-settings: 'FILL' 1;">${isHigh ? 'volume_up' : 'volume_down'}</span>
              </div>
            </button>
          `;
        }
        podsContainer.innerHTML = html;
        activeBarLabel.textContent = `Beat 1 of ${beats}`;
        attachPodListeners();
      });
    });

    // Subdivision Buttons
    document.querySelectorAll('.subdiv-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.subdiv-btn').forEach((b) => {
          b.className = 'subdiv-btn flex items-center justify-center gap-1 py-1.5 rounded-lg bg-surface-container-high text-on-surface-variant font-label-md text-label-md font-medium hover:text-on-surface transition-all active:scale-95';
        });
        btn.className = 'subdiv-btn flex items-center justify-center gap-1 py-1.5 rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md font-semibold shadow-sm transition-all active:scale-95';
      });
    });

    // Sound Dropdown Toggle
    const soundPickerBtn = document.getElementById('soundPickerBtn');
    const soundDropdown = document.getElementById('soundDropdown');
    const currentSoundLabel = document.getElementById('currentSoundLabel');

    soundPickerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      soundDropdown.classList.toggle('hidden');
    });

    document.querySelectorAll('.sound-option').forEach((opt) => {
      opt.addEventListener('click', () => {
        const sound = opt.getAttribute('data-sound');
        currentSoundLabel.textContent = sound;
        document.querySelectorAll('.sound-option').forEach((o) => {
          o.classList.remove('text-primary');
          o.classList.add('text-on-surface-variant');
          const check = o.querySelector('.material-symbols-outlined');
          if (check) check.remove();
        });
        opt.classList.remove('text-on-surface-variant');
        opt.classList.add('text-primary');
        opt.insertAdjacentHTML('beforeend', '<span class="material-symbols-outlined text-[16px]">check</span>');
        soundDropdown.classList.add('hidden');
      });
    });

    document.addEventListener('click', () => {
      if (!soundDropdown.classList.contains('hidden')) {
        soundDropdown.classList.add('hidden');
      }
    });

    // Initial setup
    updateTempo(120);
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.3)]" data-active-classes="text-primary"><div class="flex items-center justify-around h-16 px-space-xs"><a class="flex flex-col items-center justify-center min-w-[50px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="timeline" href="#"><span class="material-symbols-outlined text-[22px]">view_timeline</span><span class="font-label-sm text-label-sm mt-0.5">Timeline</span></a><a class="flex flex-col items-center justify-center min-w-[50px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="tuner" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-sm text-label-sm mt-0.5">Tuner</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[54px] h-12 transition-colors text-primary" data-path="metronome" href="#"><span class="material-symbols-outlined text-[24px]">speed</span><span class="font-label-sm text-label-sm mt-0.5">Metronome</span></a><a class="flex flex-col items-center justify-center min-w-[50px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="effects" href="#"><span class="material-symbols-outlined text-[22px]">equalizer</span><span class="font-label-sm text-label-sm mt-0.5">Effects</span></a><a class="flex flex-col items-center justify-center min-w-[50px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="pads" href="#"><span class="material-symbols-outlined text-[22px]">grid_view</span><span class="font-label-sm text-label-sm mt-0.5">Pads</span></a><a class="flex flex-col items-center justify-center min-w-[50px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="projects" href="#"><span class="material-symbols-outlined text-[22px]">folder_open</span><span class="font-label-sm text-label-sm mt-0
