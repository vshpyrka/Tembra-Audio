    document.querySelectorAll(selector).forEach((o) => {
      o.classList.replace('text-primary', 'text-on-surface-variant');
      const c = o.querySelector('.material-symbols-outlined'); if (c) c.remove();
    });
    el.classList.replace('text-on-surface-variant', 'text-primary');
    el.insertAdjacentHTML('beforeend', '<span class="material-symbols-outlined text-[16px] text-primary">check</span>');
  }
  document.querySelectorAll('.ts-opt').forEach((o) => o.addEventListener('click', () => {
    pick('.ts-opt', o);
    $('currentTimeSig').textContent = o.dataset.val;
    renderCells(+o.dataset.beats);
    setUnit(+o.dataset.unit);
  }));
  document.querySelectorAll('.snd').forEach((o) => o.addEventListener('click', () => { pick('.snd', o); $('soundLabel').textContent = o.dataset.s; }));

  // Subdivision tiles and style pills
  document.querySelectorAll('.subdiv').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.subdiv').forEach((x) => { x.classList.remove('bg-primary-container', 'text-on-primary-container'); x.classList.add('bg-surface-container-high', 'text-on-surface-variant'); });
    b.classList.remove('bg-surface-container-high', 'text-on-surface-variant'); b.classList.add('bg-primary-container', 'text-on-primary-container');
  }));
  document.querySelectorAll('.style-pill').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.style-pill').forEach((x) => { x.classList.remove('bg-secondary-container', 'text-on-secondary-container'); x.classList.add('bg-surface-container-high', 'text-on-surface-variant'); });
    b.classList.remove('bg-surface-container-high', 'text-on-surface-variant'); b.classList.add('bg-secondary-container', 'text-on-secondary-container');
  }));

  // Tempo controls
  $('decBtn').addEventListener('click', () => setTempo(bpm - 1));
  $('incBtn').addEventListener('click', () => setTempo(bpm + 1));
  const slider = $('slider');
  const fromPointer = (e) => { const r = slider.getBoundingClientRect(); setTempo(40 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 200); };
  slider.addEventListener('pointerdown', (e) => { slider.setPointerCapture(e.pointerId); fromPointer(e); });
  slider.addEventListener('pointermove', (e) => { if (e.buttons) fromPointer(e); });

  // Transport: the lit cell's bar box gets a 2 px secondary outline; play turns into pause
  function tick() {
    const boxes = document.querySelectorAll('#cells .barbox');
    boxes.forEach((b, i) => { b.style.boxShadow = i === beat ? 'inset 0 0 0 2px #ffafd3' : ''; });
    beat = (beat + 1) % beats;
  }
  function restart() { clearInterval(timer); timer = setInterval(tick, 60000 / bpm); }
  $('playBtn').addEventListener('click', () => {
    playing = !playing;
    $('playIcon').textContent = playing ? 'pause' : 'play_arrow';
    $('playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
    if (playing) { beat = 0; tick(); restart(); }
    else { clearInterval(timer); document.querySelectorAll('#cells .barbox').forEach((b) => { b.style.boxShadow = ''; }); }
  });
  $('tapBtn').addEventListener('click', () => {
    const now = performance.now();
    taps = taps.filter((t) => now - t < 2000); taps.push(now);
    $('tapFlash').classList.remove('opacity-0'); setTimeout(() => $('tapFlash').classList.add('opacity-0'), 120);
    if (taps.length >= 2) setTempo(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
  });
})();
</script>
</body></html>
