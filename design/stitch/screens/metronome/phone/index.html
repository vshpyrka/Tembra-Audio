<script>
  (function initStreamlinedMetronome() {
    let bpm = 120;
    let isPlaying = false;
    let currentBeat = 0;
    let totalBeats = 4;
    let timer = null;
    let tapTimes = [];

    const tempoDisplay = document.getElementById('tempoDisplay');
    const tempoTerm = document.getElementById('tempoTerm');
    const tempoRange = document.getElementById('tempoRange');
    const tempoArc = document.getElementById('tempoArc');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const tapTempoBtn = document.getElementById('tapTempoBtn');
    const tapRipple = document.getElementById('tapRipple');
    const tapHelperText = document.getElementById('tapHelperText');
    const podsContainer = document.getElementById('beatPodsContainer');
    const masterPulseDot = document.getElementById('masterPulseDot');

    // Time signature dropdown
    const timeSigBtn = document.getElementById('timeSigBtn');
    const timeSigDropdown = document.getElementById('timeSigDropdown');
    const currentTimeSig = document.getElementById('currentTimeSig');

    timeSigBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      timeSigDropdown.classList.toggle('hidden');
    });

    document.querySelectorAll('.ts-opt').forEach((opt) => {
      opt.addEventListener('click', () => {
        const val = opt.getAttribute('data-val');
        const beats = parseInt(opt.getAttribute('data-beats'), 10);
        currentTimeSig.textContent = val;
        timeSigDropdown.classList.add('hidden');
        renderBeats(beats);
      });
    });

    // Italian Tempo Terms
    function getItalianTerm(value) {
      if (value < 60) return 'Largo (40-59)';
      if (value < 66) return 'Larghetto (60-65)';
      if (value < 76) return 'Adagio (66-75)';
      if (value < 108) return 'Andante (76-107)';
      if (value <= 120) return 'Moderato (108-120)';
      if (value < 168) return 'Allegro (121-167)';
      if (value < 200) return 'Vivace (168-199)';
      return 'Presto (200-240)';
    }

    function updateTempo(newBpm) {
      bpm = Math.max(40, Math.min(240, Math.round(newBpm)));
      tempoDisplay.textContent = bpm;
      tempoRange.value = bpm;
      tempoTerm.textContent = getItalianTerm(bpm);

      // Arc Dash Calculation (range 40-240 mapped to stroke-dasharray)
      const ratio = (bpm - 40) / (240 - 40);
      const strokeLength = Math.round(90 + ratio * 290);
      tempoArc.setAttribute('stroke-dasharray', `${strokeLength} 600`);

      if (isPlaying) {
        restartTimer();
      }
    }

    // Audio Click Synthesizer
    let audioCtx = null;
    function playClick(accentLevel) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        if (accentLevel === 2) {
          // Accent Downbeat
          osc.frequency.setValueAtTime(1450, now);
          osc.frequency.exponentialRampToValueAtTime(450, now + 0.04);
          gain.gain.setValueAtTime(0.85, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
        } else if (accentLevel === 1) {
          // Normal Click
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.03);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        } else {
          // Sub muted click
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      } catch (e) {}
    }

    function stepBeat() {
      const pods = podsContainer.querySelectorAll('.beat-col');
      if (!pods.length) return;

      currentBeat = currentBeat % pods.length;
      
      // Pulse animation
      pods.forEach((p, idx) => {
        if (idx === currentBeat) {
          p.classList.add('ring-1', 'ring-secondary', 'brightness-125');
          setTimeout(() => p.classList.remove('ring-1', 'ring-secondary', 'brightness-125'), 110);
        }
      });

      // Master beat pulse indicator
      masterPulseDot.classList.add('scale-150', 'brightness-150');
      setTimeout(() => masterPulseDot.classList.remove('scale-150', 'brightness-150'), 100);

      const accent = currentBeat === 0 ? 2 : (currentBeat === 2 ? 0 : 1);
      playClick(accent);
      currentBeat = (currentBeat + 1) % pods.length;
    }

    function restartTimer() {
      if (timer) clearInterval(timer);
      const intervalMs = (60 / bpm) * 1000;
      timer = setInterval(stepBeat, intervalMs);
    }

    function startMetronome() {
      isPlaying = true;
      currentBeat = 0;
      playIcon.textContent = 'pause';
      playPauseBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-[0_0_8px_rgba(255,175,211,0.45)]');
      playPauseBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_0_14px_rgba(206,189,255,0.65)]');
      stepBeat();
      restartTimer();
    }

    function stopMetronome() {
      isPlaying = false;
      playIcon.textContent = 'play_arrow';
      playPauseBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_0_14px_rgba(206,189,255,0.65)]');
      playPauseBtn.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-[0_0_8px_rgba(255,175,211,0.45)]');
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) stopMetronome();
      else startMetronome();
    });

    document.getElementById('tempoIncBtn').addEventListener('click', () => updateTempo(bpm + 1));
    document.getElementById('tempoDecBtn').addEventListener('click', () => updateTempo(bpm - 1));
    tempoRange.addEventListener('input', (e) => updateTempo(e.target.value));

    // Tap Tempo Calculation
    tapTempoBtn.addEventListener('click', () => {
      const now = performance.now();
      tapTimes.push(now);

      tapRipple.classList.remove('opacity-0');
      tapRipple.classList.add('opacity-100');
      setTimeout(() => tapRipple.classList.remove('opacity-100'), 120);

      if (tapTimes.length > 4) tapTimes.shift();

      if (tapTimes.length >= 2) {
        const diffs = [];
        for (let i = 1; i < tapTimes.length; i++) {
          diffs.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = diffs.reduce((a, b) => a + b) / diffs.length;
        if (avgInterval > 220 && avgInterval < 1800) {
          const calculatedBpm = Math.round(60000 / avgInterval);
          updateTempo(calculatedBpm);
          tapHelperText.textContent = `${calculatedBpm} BPM DETECTED`;
        }
      }

      clearTimeout(tapTempoBtn._resetTimer);
      tapTempoBtn._resetTimer = setTimeout(() => {
        tapTimes = [];
        tapHelperText.textContent = 'Sync Finger Rhythm';
      }, 2400);
    });

    // Render Beat Sequencer Strip
    function renderBeats(beats) {
      totalBeats = beats;
      currentBeat = 0;
      podsContainer.className = `grid grid-cols-${beats} gap-1.5 w-full`;
      let html = '';
      for (let i = 1; i <= beats; i++) {
        if (i === 1) {
          html += `
            <div class="beat-col flex flex-col items-center gap-1 p-1 rounded-lg bg-surface-container-lowest border border-outline-variant/30 cursor-pointer active:scale-95 transition-all" data-beat="1">
              <div class="w-full h-11 bg-surface-container rounded flex items-end p-0.5 overflow-hidden">
                <div class="w-full bg-secondary rounded-sm h-[94%] shadow-[0_0_10px_rgba(255,175,211,0.6)]"></div>
              </div>
              <span class="font-label-sm text-[9px] text-secondary font-bold tracking-wider leading-none">ACCENT</span>
            </div>`;
        } else if (i === 3 && beats >= 4) {
          html += `
            <div class="beat-col flex flex-col items-center gap-1 p-1 rounded-lg bg-surface-container-lowest border border-outline-variant/30 cursor-pointer active:scale-95 transition-all" data-beat="${i}">
              <div class="w-full h-11 bg-surface-container rounded flex items-end p-0.5 overflow-hidden">
                <div class="w-full bg-primary/45 rounded-sm h-[38%]"></div>
              </div>
              <span class="font-label-sm text-[9px] text-on-surface-variant font-medium tracking-wider leading-none">SUB</span>
            </div>`;
        } else {
          html += `
            <div class="beat-col flex flex-col items-center gap-1 p-1 rounded-lg bg-surface-container-lowest border border-outline-variant/30 cursor-pointer active:scale-95 transition-all" data-beat="${i}">
              <div class="w-full h-11 bg-surface-container rounded flex items-end p-0.5 overflow-hidden">
                <div class="w-full bg-primary rounded-sm h-[64%]"></div>
              </div>
              <span class="font-label-sm text-[9px] text-on-surface font-semibold tracking-wider leading-none">CLICK</span>
            </div>`;
        }
      }
      podsContainer.innerHTML = html;
    }

    // Rhythm Subdivision Glyph Switcher
    document.querySelectorAll('.subdiv-glyph').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.subdiv-glyph').forEach((b) => {
          b.className = 'subdiv-glyph w-7 h-7 rounded-lg bg-surface-container-high text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-all active:scale-95';
        });
        btn.className = 'subdiv-glyph w-7 h-7 rounded-lg bg-primary text-on-primary font-bold flex items-center justify-center shadow-[0_0_10px_rgba(206,189,255,0.45)] transition-all active:scale-95';
      });
    });

    // Style Pills
    document.querySelectorAll('.style-pill').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.style-pill').forEach((b) => {
          b.className = 'style-pill px-2.5 py-0.5 text-[11px] rounded-full font-label-md font-medium bg-surface-container-high text-on-surface-variant hover:text-on-surface active:scale-95 transition-all';
        });
        btn.className = 'style-pill px-2.5 py-0.5 text-[11px] rounded-full font-label-md font-semibold bg-secondary-container text-on-secondary-container shadow-sm active:scale-95 transition-all';
      });
    });

    // Sound Dropdown
    const soundPickerBtn = document.getElementById('soundPickerBtn');
    const soundDropdown = document.getElementById('soundDropdown');
    const currentSoundLabel = document.getElementById('currentSoundLabel');

    soundPickerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      soundDropdown.classList.toggle('hidden');
    });

    document.querySelectorAll('.sound-option').forEach((opt) => {
      opt.addEventListener('click', () => {
        const sound = opt.getAttribute('data-sound');
        currentSoundLabel.textContent = sound;
        document.querySelectorAll('.sound-option').forEach((o) => {
          o.classList.remove('text-primary');
          o.classList.add('text-on-surface-variant');
          const check = o.querySelector('.material-symbols-outlined');
          if (check) check.remove();
        });
        opt.classList.remove('text-on-surface-variant');
        opt.classList.add('text-primary');
        opt.insertAdjacentHTML('beforeend', '<span class="material-symbols-outlined text-[14px]">check</span>');
        soundDropdown.classList.add('hidden');
      });
    });

    document.addEventListener('click', () => {
      if (!soundDropdown.classList.contains('hidden')) soundDropdown.classList.add('hidden');
      if (!timeSigDropdown.classList.contains('hidden')) timeSigDropdown.classList.add('hidden');
    });

    // Initialize
    updateTempo(120);
  })();
</script>
</body></html>
