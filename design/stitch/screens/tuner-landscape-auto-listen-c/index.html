<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tembra Audio - Mobile Landscape Auto Listen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000000;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .phone-container {
      width: 915px;
      height: 412px;
      max-width: 100vw;
      max-height: 100vh;
      background-color: #0e0e11;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <!-- Top Status Bar & Ultra-compact Header (matching Pixel 6 landscape screenshot IMAGE_22) -->
    

    <!-- Main Content Area: Left Mini-Rail + Two-Column Split (Gauge Left, Config Right) -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Mini Left Navigation Rail (From original Pixel 6 app IMAGE_22) -->
      <aside class="w-16 bg-[#131316] border-r border-[#1f1f24] flex flex-col items-center justify-between py-2 shrink-0">
        <div class="flex flex-col items-center space-y-1 w-full">
          <!-- Home -->
          <button class="flex flex-col items-center justify-center w-12 h-11 rounded-lg text-zinc-400 hover:text-white transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span class="text-[9px] font-medium mt-0.5">Home</span>
          </button>

          <!-- Timeline -->
          <button class="flex flex-col items-center justify-center w-12 h-11 rounded-lg text-zinc-400 hover:text-white transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="6" x2="8" y2="18"></line>
              <line x1="16" y1="6" x2="16" y2="18"></line>
            </svg>
            <span class="text-[9px] font-medium mt-0.5">Timeline</span>
          </button>

          <!-- Tuner (Active Pink Pill as on original screenshot) -->
          <button class="flex flex-col items-center justify-center w-12 h-11 rounded-2xl bg-[#b82a67] text-white shadow-lg shadow-pink-900/40">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path>
            </svg>
            <span class="text-[9px] font-bold mt-0.5">Tuner</span>
          </button>

          <!-- Metronome -->
          <button class="flex flex-col items-center justify-center w-12 h-11 rounded-lg text-zinc-400 hover:text-white transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="text-[9px] font-medium mt-0.5">Metronome</span>
          </button>

          <!-- Projects -->
          <button class="flex flex-col items-center justify-center w-12 h-11 rounded-lg text-zinc-400 hover:text-white transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="text-[9px] font-medium mt-0.5">Projects</span>
          </button>
        </div>

        <!-- Profile bottom -->
        <button class="flex flex-col items-center justify-center w-12 h-10 rounded-lg text-zinc-400 hover:text-white transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="text-[9px] font-medium mt-0.5">Profile</span>
        </button>
      </aside>

      <!-- Main Workspace: Split Two-Column (Left: Needle Widget, Right: Config & Strings) -->
      <main class="flex-1 flex overflow-hidden bg-gradient-to-br from-[#121216] via-[#101014] to-[#0a0a0d] p-3 gap-3 flex-row-reverse">
        
        <!-- LEFT COLUMN: Compact Frequency Gauge Widget (Exact same widget as SCREEN_100 & SCREEN_60) -->
        <section class="flex-1 bg-[#15151a]/80 backdrop-blur-md rounded-2xl border border-[#23232b] flex flex-col items-center justify-between p-3 relative overflow-hidden shadow-inner">
          <!-- Atmospheric subtle glow behind gauge -->
          <div class="absolute inset-0 bg-radial from-pink-500/10 via-transparent to-transparent pointer-events-none"></div>

          <!-- Top of widget: In Tune pill & detected note E2 -->
          <div class="flex flex-col items-center z-10">
            <div class="inline-flex items-center space-x-1.5 px-3 py-0.5 rounded-full bg-[#201d28] border border-[#3b354e] text-pink-300 shadow-sm">
              <span class="w-1.5 h-1.5 rounded-full bg-pink-400"></span>
              <span class="text-[10px] font-bold tracking-wider uppercase">IN TUNE</span>
            </div>
            
            <div class="flex items-baseline space-x-1 mt-0.5">
              <span class="text-4xl font-extrabold text-white tracking-tight leading-none">E</span>
              <span class="text-xl font-bold text-pink-300">2</span>
            </div>
          </div>

          <!-- Exact Semicircular Arc Gauge SVG scaled for landscape height without clipping -->
          <div class="relative w-full max-w-[280px] h-[130px] flex items-end justify-center z-10 my-0">
            <svg class="w-full h-full" viewBox="0 0 300 150" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="arcGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#4a4066"></stop>
                  <stop offset="50%" stop-color="#a78bfa"></stop>
                  <stop offset="100%" stop-color="#4a4066"></stop>
                </linearGradient>
                <filter id="neonNeedleGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
                  <feMerge>
                    <feMergeNode in="blur"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
              </defs>

              <!-- Outer Guide Arc -->
              <path d="M 25 140 A 125 125 0 0 1 275 140" stroke="#262530" stroke-width="4" stroke-linecap="round"></path>
              <!-- Inner Active Arc Center Zone -->
              <path d="M 110 35 A 125 125 0 0 1 190 35" stroke="url(#arcGlow)" stroke-width="6" stroke-linecap="round" opacity="0.8"></path>
              <!-- Dashed Tick Accents (from original SCREEN_100) -->
              <path d="M 120 70 A 90 90 0 0 1 180 70" stroke="#ec4899" stroke-width="4" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.6"></path>

              <!-- Tick Marks at -50, -25, 0, +25, +50 -->
              <line x1="25" y1="140" x2="38" y2="140" stroke="#52525b" stroke-width="3" stroke-linecap="round"></line>
              <line x1="60" y1="85" x2="72" y2="92" stroke="#52525b" stroke-width="2.5" stroke-linecap="round"></line>
              <line x1="150" y1="15" x2="150" y2="30" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round"></line>
              <line x1="240" y1="85" x2="228" y2="92" stroke="#52525b" stroke-width="2.5" stroke-linecap="round"></line>
              <line x1="275" y1="140" x2="262" y2="140" stroke="#52525b" stroke-width="3" stroke-linecap="round"></line>

              <!-- Center Neon Indicator Needle pointing straight up (In Tune) -->
              <!-- Vertical glowing line from pivot (150, 140) to tip (150, 20) -->
              <line x1="150" y1="140" x2="150" y2="20" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round" filter="url(#neonNeedleGlow)"></line>
              <line x1="150" y1="140" x2="150" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></line>

              <!-- Center Base Pivot Circles -->
              <circle cx="150" cy="140" r="7" fill="#131316" stroke="#f472b6" stroke-width="2.5"></circle>
              <circle cx="150" cy="140" r="3" fill="#ffffff"></circle>
            </svg>
          </div>

          <!-- Bottom: Frequency Readout & Target Hz (Placed cleanly below widget with zero overlap) -->
          <div class="w-full flex items-center justify-between px-2 pt-1 border-t border-[#23232b]/80 z-10 text-xs">
            <span class="text-[11px] font-medium text-zinc-400">◀ Flat</span>

            <div class="flex items-center space-x-2">
              <span class="text-sm font-bold text-white tracking-wide">82.4 Hz</span>
              <span class="text-zinc-600">•</span>
              <div class="px-2 py-0.5 rounded bg-pink-950/60 border border-pink-800/60 text-pink-300 text-[10px] font-semibold">
                TARGET 82.4 HZ
              </div>
            </div>

            <span class="text-[11px] font-medium text-zinc-400">Sharp ▶</span>
          </div>
        </section>

        <!-- RIGHT COLUMN: Tuner Configuration, String Bar, Reference Pitch & Gate (No vertical clipping) -->
        <section class="flex-1 bg-[#15151a]/80 backdrop-blur-md rounded-2xl border border-[#23232b] flex flex-col justify-between p-3.5 shadow-inner"><div class="flex items-center justify-between border-b border-[#23232b] pb-2"><div class="flex items-center space-x-1.5"><span class="text-[11px] font-bold text-white uppercase tracking-wider">Controls &amp; Mode</span></div><div class="flex items-center space-x-1.5 px-2 py-0.5 rounded-full bg-[#18181c] border border-[#2c2c34]"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span class="text-[10px] font-semibold tracking-wider text-emerald-400">MIC ACTIVE</span></div></div><div class="flex flex-col gap-2.5 py-1"><div class="flex flex-col gap-1"><span class="text-[10px] font-bold text-zinc-400 tracking-wider uppercase">INSTRUMENT</span><div class="grid grid-cols-2 gap-1.5 bg-[#18181c] p-1 rounded-lg border border-[#2b2b32]"><button class="flex items-center justify-center space-x-1.5 py-1.5 rounded-md bg-[#b82a67] text-white text-xs font-semibold shadow-sm"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 4.41c-.78-.78-2.05-.78-2.83 0l-1.34 1.34 2.83 2.83 1.34-1.34c.78-.78.78-2.05 0-2.83zM3 18.25V21h2.75L17.5 9.25l-2.75-2.75L3 18.25z"></path></svg><span class="">Guitar</span></button><button class="flex items-center justify-center space-x-1.5 py-1.5 rounded-md text-zinc-400 hover:text-white text-xs font-medium"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 0-2 2c0 .74.4 1.39 1 1.73V8.5C9.5 9 8 11 8 13.5c0 1.6 1 3 2 4v2.5a2 2 0 1 0 4 0V17.5c1-1 2-2.4 2-4 0-2.5-1.5-4.5-3-5V5.73c.6-.34 1-.99 1-1.73a2 2 0 0 0-2-2z"></path></svg><span class="">Cello</span></button></div></div><div class="flex flex-col gap-1"><span class="text-[10px] font-bold text-zinc-400 tracking-wider uppercase">STRINGS</span><div class="grid grid-cols-2 gap-1.5 bg-[#18181c] p-1 rounded-lg border border-[#2b2b32]"><button class="py-1.5 rounded-md bg-[#2a2a32] text-white text-xs font-semibold text-center">6-String</button><button class="py-1.5 rounded-md text-zinc-400 hover:text-white text-xs font-medium text-center">7-String</button></div></div><div class="flex flex-col gap-1"><span class="text-[10px] font-bold text-zinc-400 tracking-wider uppercase">TUNING MODE</span><div class="grid grid-cols-2 gap-1.5 bg-[#18181c] p-1 rounded-lg border border-[#2b2b32]"><button class="flex items-center justify-center space-x-1.5 py-1.5 rounded-md bg-[#8e75ff] text-white text-xs font-semibold shadow-sm"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg><span class="">Auto Listen</span></button><button class="flex items-center justify-center space-x-1.5 py-1.5 rounded-md text-zinc-400 hover:text-white text-xs font-medium"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10"></path><path d="M14 13a2.5 2.5 0 0 0-2.5-2.5"></path></svg><span class="">By Ear</span></button></div></div></div></section>

      </main>
    </div>

    <!-- Phone Navigation Bar / Android Gestures Indicator -->
    <div class="h-3 bg-[#0e0e11] flex items-center justify-center shrink-0">
      <div class="w-28 h-1 bg-zinc-600 rounded-full"></div>
    </div>
  </div>







</body></html>
