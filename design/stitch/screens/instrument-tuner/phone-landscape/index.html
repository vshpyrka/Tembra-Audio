<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tembra Audio - Tuner (Auto Listen) v2</title>
<!-- Google Fonts: Space Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet"/>
<!-- Tailwind CSS v3 with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            brand: {
              magenta: '#b82a67',
              magentalight: '#c93375',
              purple: '#9d72f9',
              dark: '#0c0c0f',
              panel: '#15151a',
              card: '#1b1b22',
              border: '#272730',
            }
          }
        }
      }
    }
  </script>
<!-- Styles for custom gauge and layout constraints -->
<style data-purpose="custom-styling">
    body {
      background-color: #050507;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    /* Fixed phone landscape canvas */
    .phone-canvas {
      width: 915px;
      height: 412px;
      max-width: 915px;
      max-height: 412px;
    }
    /* Gauge arc styling */
    .gauge-needle-glow {
      filter: drop-shadow(0 0 8px rgba(184, 42, 103, 0.75));
    }
    /* Navigation rail glyphs: Material Symbols Outlined, unfilled, 24 px */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: 400; font-style: normal; line-height: 1; letter-spacing: normal;
      text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .indicator-crosshair {
      filter: drop-shadow(0 0 6px rgba(157, 114, 249, 0.45));
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-zinc-100 overflow-hidden font-sans">
<!-- BEGIN: PhoneDeviceContainer -->
<!-- Encapsulates the entire ~20:9 landscape viewport -->
<div class="phone-canvas relative flex flex-col bg-[#0e0e12] rounded-3xl border border-zinc-800 shadow-2xl overflow-hidden" data-purpose="landscape-phone-device">
<!-- BEGIN: StatusBar -->
<!-- Top compact mobile landscape status bar -->
<header class="h-6 w-full px-5 flex items-center justify-between text-[11px] text-zinc-400 font-medium select-none z-20 shrink-0 border-b border-zinc-900/60" data-purpose="status-bar">
<div class="flex items-center space-x-2">
<span class="text-zinc-200 font-semibold tracking-wide">11:58</span>
<!-- Small icon / spiral indicator -->
<svg class="w-3 h-3 text-zinc-400 inline" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v1m0 14v1m8-8h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div class="flex items-center space-x-2 text-zinc-400">
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3.5 text-zinc-300" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
<path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
<path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
<line x1="12" x2="12.01" y1="20" y2="20"></line>
</svg>
<!-- Battery Icon with charge -->
<div class="flex items-center space-x-0.5">
<div class="w-5 h-2.5 rounded-sm border border-zinc-400 p-[1px] flex items-center">
<div class="bg-emerald-400 h-full w-4/5 rounded-2xs"></div>
</div>
<div class="w-0.5 h-1 bg-zinc-400 rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: MainContentWrapper -->
<!-- Contains the left navigation rail, the control panel, and the tuner gauge widget -->
<div class="flex-1 flex overflow-hidden w-full relative" data-purpose="main-layout-area">
<!-- BEGIN: LeftmostNavRail -->
<!-- Matches https://lh3.googleusercontent.com/aida-public/AB6AXuB-L7LGmPHvUVQZUXV97PBVcVyxA42MgaXWnyPeN0VE8N-Fxm2bi8F0ZQq2N9P5kLP9YMODnocSGdSIc3P1RPL3c-CwZLgKE-qb-7y6JmzuyYIgnzn5YiRr8fG2OO39UHZZjvJm5wFtNX7orpBpPW3aQScdvxWYHGh7AxRE_IgjB4rCKKOBy8DjC50JLdMUbUsAdwric5aX_Gm1h3wuhgW0eSCSPu2PtHNNobjPXkt_8wnD314iyJVf2gJlLwuN8FgWgL4 Navigation Rail -->
<nav class="w-24 bg-[#0e0e11] flex flex-col items-center gap-1 pt-11 shrink-0 z-10 select-none" aria-label="Primary" data-purpose="left-navigation-rail">
<a class="w-14 h-14 rounded-full flex items-center justify-center text-[#cac4d4]" href="#" aria-label="Timeline"><span class="material-symbols-outlined text-[24px] leading-none">graphic_eq</span></a>
<a class="w-14 h-14 rounded-full flex items-center justify-center bg-[#85145a] text-[#ff93c8]" href="#" aria-label="Tuner" aria-current="page"><span class="material-symbols-outlined text-[24px] leading-none">music_note</span></a>
<a class="w-14 h-14 rounded-full flex items-center justify-center text-[#cac4d4]" href="#" aria-label="Metronome"><span class="material-symbols-outlined text-[24px] leading-none">av_timer</span></a>
<a class="w-14 h-14 rounded-full flex items-center justify-center text-[#cac4d4]" href="#" aria-label="Projects"><span class="material-symbols-outlined text-[24px] leading-none">folder</span></a>
<a class="w-14 h-14 rounded-full flex items-center justify-center text-[#cac4d4]" href="#" aria-label="Profile"><span class="material-symbols-outlined text-[24px] leading-none">person</span></a>
</nav>
<!-- END: LeftmostNavRail -->
<!-- BEGIN: ControlsPanel -->
<!-- Compact sidebar containing all settings reorganized from Image 32 toolbar -->
<section class="w-72 bg-[#121217] border-r border-[#202027] p-3 flex flex-col justify-between shrink-0" data-purpose="tuner-controls-panel">
<!-- Header & Mic Status -->
<div class="flex items-center justify-between border-b border-zinc-800/80 pb-2">
<div>
<div class="text-[10px] uppercase font-bold text-zinc-400 tracking-wider">Tuner Controls</div>
<div class="text-xs font-bold text-zinc-100">Settings &amp; Mode</div>
</div>
<!-- MIC ACTIVE Pill Badge -->
<div class="flex items-center space-x-1.5 px-2 py-0.5 rounded-full bg-[#1b1b24] border border-zinc-700/60 shadow-inner">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
<!-- Mic SVG -->
<svg class="w-3 h-3 text-zinc-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[9px] font-semibold text-zinc-300 uppercase tracking-wider">Mic Active</span>
</div>
</div>
<!-- Setting 1: Instrument Switcher -->
<div class="space-y-1">
<label class="text-[10px] uppercase font-bold tracking-wider text-zinc-400">Instrument</label>
<div class="grid grid-cols-2 gap-1 bg-[#1a1a22] p-1 rounded-lg border border-zinc-800">
<!-- Guitar (Active) -->
<button class="flex items-center justify-center space-x-1 py-1 px-2 rounded-md bg-brand-magenta text-white font-semibold text-xs shadow-sm">
<span>Guitar</span>
</button>
<!-- Cello (Inactive) -->
<button class="flex items-center justify-center space-x-1 py-1 px-2 rounded-md text-zinc-400 hover:text-zinc-200 text-xs font-medium">
<span>Cello</span>
</button>
</div>
</div>
<!-- Setting 2: String Count Toggle -->
<div class="space-y-1">
<label class="text-[10px] uppercase font-bold tracking-wider text-zinc-400">Configuration</label>
<div class="grid grid-cols-2 gap-1 bg-[#1a1a22] p-1 rounded-lg border border-zinc-800">
<!-- 6-String (Active) -->
<button class="py-1 rounded-md bg-zinc-800 text-zinc-100 font-semibold text-xs text-center border border-zinc-700/70 shadow-inner">
              6-String
            </button>
<!-- 7-String (Inactive) -->
<button class="py-1 rounded-md text-zinc-400 hover:text-zinc-200 text-xs font-medium text-center">
              7-String
            </button>
</div>
</div>
<!-- Setting 3: Tuning Mode Switcher -->
<div class="space-y-1">
<label class="text-[10px] uppercase font-bold tracking-wider text-zinc-400">Tuning Mode</label>
<div class="grid grid-cols-2 gap-1 bg-[#1a1a22] p-1 rounded-lg border border-zinc-800">
<!-- Auto Listen (Active Purple) -->
<button class="flex items-center justify-center space-x-1 py-1 px-1.5 rounded-md bg-brand-purple text-zinc-950 font-bold text-xs shadow">
<svg class="w-3 h-3 text-zinc-950" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="truncate">Auto Listen</span>
</button>
<!-- By Ear (Inactive) -->
<button class="flex items-center justify-center space-x-1 py-1 px-1.5 rounded-md text-zinc-400 hover:text-zinc-200 text-xs font-medium">
<!-- Ear Icon -->
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M11 5a4 4 0 018 0c0 3-2 5-2 7a4 4 0 01-4 4h-1m-1-11a5 5 0 00-5 5v3a5 5 0 0010 0v-1" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="truncate">By Ear</span>
</button>
</div>
</div>
<!-- Noise gate (feature 006): the handle is the gate level, the fill the live input level -->
<div data-purpose="noise-gate" aria-label="Noise gate" style="display:flex;flex-direction:column;gap:2px;margin-bottom:4px;">
<span style="font-family:inherit;font-size:10px;font-weight:700;letter-spacing:0.05em;color:#a1a1aa;text-transform:uppercase;line-height:14px;">NOISE GATE</span>
<div style="height:28px;display:flex;align-items:center;">
<span style="font-family:inherit;font-size:10px;font-weight:500;color:#a1a1aa;font-feature-settings:'tnum' 1;">Off</span>
<div style="position:relative;flex:1;height:28px;">
<div style="position:absolute;left:22px;right:22px;top:12.5px;height:3px;border-radius:1.5px;background:#353438;"></div>
<div style="position:absolute;left:22px;top:12.5px;height:3px;border-radius:1.5px;background:#cebdff;width:calc((100% - 44px) * 0.583);"></div>
<div style="position:absolute;top:8.0px;width:12px;height:12px;border-radius:6.0px;background:#cebdff;left:calc(22px + (100% - 44px) * 0.5 - 6.0px);"></div>
</div>
<span style="font-family:inherit;font-size:10px;font-weight:500;color:#a1a1aa;font-feature-settings:'tnum' 1;">High</span>
</div>
</div>
<!-- Bottom Info Note -->
<div class="bg-[#181820] p-2 rounded-lg border border-zinc-800/80 flex items-center justify-between">
<span class="text-[10px] text-zinc-400">Pitch Reference</span>
<span class="text-[11px] font-mono font-bold text-zinc-300">A4 = 440 Hz</span>
</div>
</section>
<!-- END: ControlsPanel -->
<!-- BEGIN: TunerGaugeWidget -->
<!-- Centerpiece widget: frequency arc, needle, note display and status -->
<main class="flex-1 bg-[#141419] p-3 flex flex-col justify-between relative overflow-hidden" data-purpose="tuner-needle-gauge-widget">
<!-- Top status strip within gauge area -->
<div class="w-full flex items-center justify-between z-10">
<div class="flex items-center space-x-2">
<span class="text-xs font-bold text-zinc-300 tracking-wide">GUITAR: STRING 6 (LOW E)</span>
</div>
<!-- IN TUNE Pill Indicator -->
<div class="px-3 py-1 rounded-full bg-[#1e1e28] border border-zinc-700/80 flex items-center space-x-2 shadow-sm">
<span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
<span class="text-[10px] font-bold text-zinc-200 tracking-widest uppercase">In Tune</span>
</div>
<!-- Target Note Badge -->
<div class="text-[11px] font-mono text-zinc-400 bg-zinc-900/90 px-2 py-0.5 rounded border border-zinc-800">
            TARGET: <span class="text-brand-purple font-semibold">82.4 Hz</span>
</div>
</div>
<!-- Middle: Detected Note & Listening Header -->
<div class="flex flex-col items-center justify-center my-auto z-10 pt-1">
<span class="text-xs uppercase tracking-widest text-zinc-400 font-semibold mb-0.5">Listening</span>
<div class="flex items-baseline space-x-1.5">
<span class="text-4xl font-extrabold tracking-tight text-white drop-shadow-md">E<span class="text-2xl text-brand-magenta">2</span></span>
<span class="text-sm font-mono font-medium text-emerald-400">82.4 Hz</span>
</div>
<span class="text-[10px] font-mono text-emerald-400/90 tracking-wide font-medium bg-emerald-950/30 px-2 py-0.5 rounded mt-0.5 border border-emerald-800/40">±0.0 Cents</span>
</div>
<!-- Bottom: Arc Gauge with Centered Needle Indicator -->
<div class="relative w-full h-36 flex items-end justify-center overflow-hidden" data-purpose="frequency-gauge-graphic">
<!-- SVG Semi-Circular Tuner Arc -->
<svg class="w-full max-w-lg h-36" viewbox="0 0 400 150">
<defs>
<lineargradient id="arcGradient" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"></stop>
<stop offset="35%" stop-color="#a855f7" stop-opacity="0.5"></stop>
<stop offset="50%" stop-color="#10b981" stop-opacity="0.9"></stop>
<stop offset="65%" stop-color="#a855f7" stop-opacity="0.5"></stop>
<stop offset="100%" stop-color="#ef4444" stop-opacity="0.3"></stop>
</lineargradient>
</defs>
<!-- Main Arc Guide -->
<path d="M 40 140 A 160 160 0 0 1 360 140" fill="none" stroke="url(#arcGradient)" stroke-linecap="round" stroke-width="4"></path>
<!-- Gauge Ticks: Left (Flat) -->
<line stroke="#475569" stroke-width="1.5" x1="60" x2="70" y1="130" y2="124"></line>
<line stroke="#475569" stroke-width="1.5" x1="88" x2="98" y1="105" y2="101"></line>
<line stroke="#64748b" stroke-width="2" x1="120" x2="128" y1="84" y2="81"></line>
<line stroke="#64748b" stroke-width="2" x1="156" x2="162" y1="69" y2="67"></line>
<!-- Center Green Deadband / In-Tune Markers -->
<line stroke="#10b981" stroke-width="2" x1="190" x2="190" y1="60" y2="52"></line>
<line stroke="#10b981" stroke-width="3" x1="200" x2="200" y1="58" y2="48"></line>
<line stroke="#10b981" stroke-width="2" x1="210" x2="210" y1="60" y2="52"></line>
<!-- Gauge Ticks: Right (Sharp) -->
<line stroke="#64748b" stroke-width="2" x1="238" x2="244" y1="67" y2="69"></line>
<line stroke="#64748b" stroke-width="2" x1="272" x2="280" y1="81" y2="84"></line>
<line stroke="#475569" stroke-width="1.5" x1="302" x2="312" y1="101" y2="105"></line>
<line stroke="#475569" stroke-width="1.5" x1="330" x2="340" y1="124" y2="130"></line>
<!-- Center Horizontal Crosshair line from Image 32 -->
<line class="indicator-crosshair opacity-80" stroke="#7e69ab" stroke-linecap="round" stroke-width="7" x1="180" x2="220" y1="105" y2="105"></line>
<!-- Center Needle (Vertical Pink/Magenta indicator from Image 32) -->
<line class="gauge-needle-glow" stroke="#f472b6" stroke-linecap="round" stroke-width="4.5" x1="200" x2="200" y1="60" y2="148"></line>
<line stroke="#b82a67" stroke-linecap="round" stroke-width="3" x1="200" x2="200" y1="68" y2="145"></line>
</svg>
<!-- Flat and Sharp Markers -->
<div class="absolute bottom-1 w-full px-12 flex justify-between text-[11px] font-bold text-zinc-400 select-none">
<span class="flex items-center text-zinc-400 hover:text-zinc-200">
<svg class="w-3 h-3 mr-0.5 inline" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
              FLAT (-50c)
            </span>
<span class="text-emerald-400 font-extrabold text-xs">PERFECT</span>
<span class="flex items-center text-zinc-400 hover:text-zinc-200">
              SHARP (+50c)
              <svg class="w-3 h-3 ml-0.5 inline" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
</span>
</div>
</div>
</main>
<!-- END: TunerGaugeWidget -->
</div>
<!-- END: MainContentWrapper -->
<!-- BEGIN: AndroidGestureBar -->
<!-- Android bottom gesture navigation pill -->
<div class="w-full h-3 flex items-center justify-center bg-[#0c0c0f] shrink-0" data-purpose="bottom-gesture-bar">
<div class="w-36 h-1 bg-zinc-600/80 rounded-full"></div>
</div>
<!-- END: AndroidGestureBar -->
</div>
<!-- END: PhoneDeviceContainer -->
</body></html>
