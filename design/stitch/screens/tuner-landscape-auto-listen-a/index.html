<script>
  // Subtle natural needle shimmer micro-interaction

    const needle = document.getElementById('tuner-needle');
    if (!needle) return;
    let angle = 0;
    setInterval(() => {
      // Gentle jitter around center (+/- 1.2 degrees) to simulate real-time DSP pitch detection
      angle = (Math.random() - 0.48) * 2.2;
      needle.style.transform = `rotate(${angle}deg)`;
    }, 280);

    // Instrument toggle button states
    const btnGuitar = document.getElementById('btn-guitar');
    const btnCello = document.getElementById('btn-cello');
    if (btnGuitar && btnCello) {
