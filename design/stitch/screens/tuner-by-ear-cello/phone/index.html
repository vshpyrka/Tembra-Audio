<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base { html, body { width: 100vw; margin: 0; padding: 0; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary-fixed": "#ffd8e7", "surface-bright": "#39393c", "secondary-fixed-dim": "#ffafd3", "tertiary-fixed-dim": "#d0bcff", "inverse-primary": "#674bb5", "on-tertiary": "#3c0091", "error": "#ffb4ab", "on-primary-fixed-variant": "#4f319c", "tertiary": "#d0bcff", "on-background": "#e4e1e6", "on-secondary-container": "#ff93c8", "inverse-surface": "#e4e1e6", "on-tertiary-fixed-variant": "#5516be", "background": "#131316", "error-container": "#93000a", "surface-container-lowest": "#0e0e11", "tertiary-container": "#ab88ff", "on-surface-variant": "#cac4d4", "primary-fixed-dim": "#cebdff", "on-surface": "#e4e1e6", "outline-variant": "#494552", "on-tertiary-container": "#40009b", "surface-container-high": "#2a2a2d", "on-secondary-fixed-variant": "#85145a", "surface-tint": "#cebdff", "on-tertiary-fixed": "#23005c", "secondary": "#ffafd3", "on-error-container": "#ffdad6", "on-primary": "#381385", "on-primary-fixed": "#21005e", "surface-variant": "#353438", "surface-container-highest": "#353438", "primary": "#cebdff", "tertiary-fixed": "#e9ddff", "inverse-on-surface": "#303033", "on-error": "#690005", "secondary-container": "#85145a", "surface-dim": "#131316", "surface-container-low": "#1b1b1e", "surface-container": "#1f1f22", "outline": "#948e9d", "on-secondary-fixed": "#3d0026", "on-secondary": "#620040", "primary-fixed": "#e8ddff", "surface": "#131316", "primary-container": "#a78bfa", "on-primary-container": "#3c1989" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "0.75rem", "space-xl": "1.75rem", "gutter": "0.75rem", "space-lg": "1.25rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "margin": "1rem" }, fontFamily: { "headline-sm": ["Space Grotesk"], "headline-lg-mobile": ["Space Grotesk"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Space Grotesk"], "tabular-param": ["Inter"], "label-sm": ["Space Grotesk"], "label-md": ["Space Grotesk"], "label-lg": ["Space Grotesk"], "headline-lg": ["Space Grotesk"], "body-lg": ["Inter"], "tabular-timecode": ["Space Grotesk"] }, fontSize: { "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "tabular-param": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "tabular-timecode": ["15px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-20 min-h-screen bg-surface"><div class="flex flex-col flex-1 justify-between w-full px-gutter gap-space-md py-space-sm">
<!-- Instrument & Mode Switchers -->
<section class="flex flex-col gap-space-xs mt-space-xs">
<!-- Top Row: Instrument Tabs & Audio Input Status -->
<div class="flex items-center justify-between gap-space-sm">
<div class="inline-flex p-1 rounded-xl bg-surface-container-lowest gap-1"><button class="h-8 px-space-md rounded-lg text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center gap-1.5 transition-all" id="btn-inst-guitar"><span class="">Guitar</span></button><button class="h-8 px-space-md rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md flex items-center gap-1.5 transition-all shadow-sm" id="btn-inst-cello"><span class="">Cello</span></button></div>
<div class="flex items-center gap-1.5 px-space-sm py-1 rounded-full bg-surface-container-low text-primary text-tabular-param font-tabular-param"><span class="material-symbols-outlined text-[14px] text-secondary">volume_up</span><span class="font-semibold text-secondary tracking-wider text-[11px]">TONE OUT</span></div>
</div>
<!-- Sub-row: String Count & Method Selector -->
<div class="flex items-center justify-between gap-space-sm">
<!-- String selector -->
<div class="inline-flex rounded-lg bg-surface-container-low p-0.5" id="string-count-group"><button class="h-7 px-space-md rounded-md bg-surface-container-high text-primary font-label-sm text-label-sm font-semibold" id="btn-4str">4-String</button><span class="h-7 px-space-sm rounded-md text-outline font-label-sm text-label-sm flex items-center">Cello Std</span></div>
<!-- Mode: Auto vs Ear -->
<div class="inline-flex rounded-lg bg-surface-container-low p-0.5"><button class="h-7 px-space-sm rounded-md text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm flex items-center gap-1 transition-all" id="mode-auto"><span class="material-symbols-outlined text-[14px]">mic</span><span class="">Auto Listen</span></button><button class="h-7 px-space-sm rounded-md bg-primary-container text-on-primary-container font-label-sm text-label-sm flex items-center gap-1 shadow-sm font-semibold" id="mode-ear"><span class="material-symbols-outlined text-[14px]">hearing</span><span class="">By Ear</span></button></div>
</div>
</section>
<!-- Central Strobe Arc & Pitch Display -->
<section class="flex flex-col justify-between p-space-md py-4 rounded-2xl bg-surface-container-lowest relative overflow-hidden shadow-lg flex-1 border border-outline-variant/20">
  <!-- Background Ambient Glow -->
  <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(circle at 50% 30%, rgba(171, 136, 255, 0.06) 0%, rgba(133, 20, 90, 0.06) 40%, transparent 75%);"></div>
  <div class="absolute -top-16 -left-16 w-56 h-56 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-16 -right-16 w-56 h-56 rounded-full bg-secondary-container/15 blur-3xl pointer-events-none"></div>

  <!-- Top Preset & Loop Controls Unified with Tablet -->
  <div class="w-full flex items-center justify-between z-10 gap-2 mb-2">
    <button class="flex items-center gap-2 bg-surface-container-low px-3 py-2 rounded-xl border border-outline-variant/30 shadow-sm text-left hover:border-outline-variant/60 transition-all flex-1">
      <span class="material-symbols-outlined text-primary text-[18px]">music_note</span>
      <div class="flex flex-col flex-1 truncate">
        <span class="font-label-sm text-[9px] text-outline tracking-wider uppercase font-semibold leading-none">Tuning Preset</span>
        <span class="font-label-md text-label-md text-on-surface font-semibold truncate">Standard (C2 G2 D3 A3)</span>
      </div>
      <span class="material-symbols-outlined text-outline-variant text-[18px]">expand_more</span>
    </button>

    <div class="flex items-center gap-2 bg-surface-container-low px-3 py-2 rounded-xl border border-outline-variant/30 shadow-sm shrink-0">
      <div class="flex flex-col items-end">
        <span class="font-label-sm text-[9px] text-secondary font-semibold uppercase tracking-wider leading-none">Loop Tone</span>
        <span class="font-label-sm text-[11px] text-on-surface font-medium">Active</span>
      </div>
      <div class="w-8 h-4 rounded-full bg-secondary flex items-center justify-end px-0.5 shadow-sm">
        <div class="w-3 h-3 rounded-full bg-on-secondary-container shadow-sm"></div>
      </div>
    </div>
  </div>

  <!-- 2x2 String Audition Cards Matching Tablet Component Language -->
  <div class="w-full grid grid-cols-2 gap-space-sm z-10 my-auto py-1 max-w-sm mx-auto"><!-- Card 1: C2 -->
    <div class="aspect-square flex flex-col justify-between p-3 rounded-xl bg-surface-container-low border border-outline-variant/20 hover:border-outline-variant/40 transition-all text-left relative overflow-hidden group shadow-sm">
      <div class="flex items-center justify-between w-full">
        <span class="font-label-sm text-[11px] font-bold text-outline tracking-wider">IV</span>
        <span class="font-tabular-timecode text-[11px] text-on-surface-variant font-medium">65.4 Hz</span>
      </div>
      <div class="flex items-baseline justify-center my-auto py-0.5">
        <span class="font-headline-md text-[32px] font-bold text-on-surface leading-none">C</span>
        <span class="font-headline-sm text-[20px] text-primary font-bold ml-0.5">2</span>
      </div>
      <button class="w-full py-1.5 px-2 rounded-lg bg-surface-container-high/60 hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface font-label-sm text-[11px] font-semibold flex items-center justify-center gap-1 transition-all border border-outline-variant/20">
        <span class="material-symbols-outlined text-[14px]">play_arrow</span>
        <span class="">Audition</span>
      </button>
    </div>

    <!-- Card 2: G2 -->
    <div class="aspect-square flex flex-col justify-between p-3 rounded-xl bg-surface-container-low border border-outline-variant/20 hover:border-outline-variant/40 transition-all text-left relative overflow-hidden group shadow-sm">
      <div class="flex items-center justify-between w-full">
        <span class="font-label-sm text-[11px] font-bold text-outline tracking-wider">III</span>
        <span class="font-tabular-timecode text-[11px] text-on-surface-variant font-medium">98.0 Hz</span>
      </div>
      <div class="flex items-baseline justify-center my-auto py-0.5">
        <span class="font-headline-md text-[32px] font-bold text-on-surface leading-none">G</span>
        <span class="font-headline-sm text-[20px] text-primary font-bold ml-0.5">2</span>
      </div>
      <button class="w-full py-1.5 px-2 rounded-lg bg-surface-container-high/60 hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface font-label-sm text-[11px] font-semibold flex items-center justify-center gap-1 transition-all border border-outline-variant/20">
        <span class="material-symbols-outlined text-[14px]">play_arrow</span>
        <span class="">Audition</span>
      </button>
    </div>

    <!-- Card 3: D3 -->
    <div class="aspect-square flex flex-col justify-between p-3 rounded-xl bg-surface-container-low border border-outline-variant/20 hover:border-outline-variant/40 transition-all text-left relative overflow-hidden group shadow-sm">
      <div class="flex items-center justify-between w-full">
        <span class="font-label-sm text-[11px] font-bold text-outline tracking-wider">II</span>
        <span class="font-tabular-timecode text-[11px] text-on-surface-variant font-medium">146.8 Hz</span>
      </div>
      <div class="flex items-baseline justify-center my-auto py-0.5">
        <span class="font-headline-md text-[32px] font-bold text-on-surface leading-none">D</span>
        <span class="font-headline-sm text-[20px] text-primary font-bold ml-0.5">3</span>
      </div>
      <button class="w-full py-1.5 px-2 rounded-lg bg-surface-container-high/60 hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface font-label-sm text-[11px] font-semibold flex items-center justify-center gap-1 transition-all border border-outline-variant/20">
        <span class="material-symbols-outlined text-[14px]">play_arrow</span>
        <span class="">Audition</span>
      </button>
    </div>

    <!-- Card 4: A3 (Playing / Active) -->
    <div class="aspect-square flex flex-col justify-between p-3 rounded-xl bg-secondary-container/30 border border-secondary shadow-[0_0_18px_rgba(133,20,90,0.4)] transition-all text-left relative overflow-hidden">
      <div class="absolute -right-4 -bottom-4 w-16 h-16 rounded-full bg-secondary/20 blur-xl pointer-events-none"></div>
      <div class="flex items-center justify-between w-full relative z-10">
        <span class="font-label-sm text-[11px] font-bold text-secondary tracking-wider">I</span>
        <span class="font-tabular-timecode text-[11px] text-secondary font-bold">220.0 Hz</span>
      </div>
      <div class="flex items-baseline justify-center my-auto py-0.5 relative z-10">
        <span class="font-headline-md text-[32px] font-bold text-on-surface leading-none">A</span>
        <span class="font-headline-sm text-[20px] text-secondary font-bold ml-0.5">3</span>
      </div>
      <button class="w-full py-1.5 px-2 rounded-lg bg-secondary text-on-secondary-container font-label-sm text-[11px] font-bold flex items-center justify-center gap-1 shadow-sm relative z-10">
        <span class="material-symbols-outlined text-[14px] animate-pulse">pause</span>
        <span class="">Playing</span>
        <div class="flex items-center gap-0.5 h-3 ml-1">
          <div class="w-0.5 bg-on-secondary-container rounded-full h-2.5 animate-pulse"></div>
          <div class="w-0.5 bg-on-secondary-container rounded-full h-1"></div>
          <div class="w-0.5 bg-on-secondary-container rounded-full h-3 animate-pulse"></div>
          <div class="w-0.5 bg-on-secondary-container rounded-full h-1.5"></div>
        </div>
      </button>
    </div></div>
</section>
<!-- Interactive String Trigger Pad Matrix -->
<!-- Calibration & Input Gain Slider Card -->
</div>
<script>
  (function() {
    let calibration = 440;
    const calibValEl = document.getElementById('calib-val');
    const needleEl = document.getElementById('tuner-needle');
    const detectedNote = document.getElementById('detected-note');
    const detectedOctave = document.getElementById('detected-octave');
    const detectedFreq = document.getElementById('detected-freq');
    const centOffset = document.getElementById('cent-offset');
    const tuneStatus = document.getElementById('tune-status');
    const stringsGrid = document.getElementById('strings-grid');

    // Instrument state configs
    const configs = {
      guitar6: [
        { id: '06', note: 'E', oct: '2', freq: '82.4', active: true },
        { id: '05', note: 'A', oct: '2', freq: '110.0' },
        { id: '04', note: 'D', oct: '3', freq: '146.8' },
        { id: '03', note: 'G', oct: '3', freq: '196.0' },
        { id: '02', note: 'B', oct: '3', freq: '246.9' },
        { id: '01', note: 'E', oct: '4', freq: '329.6' }
      ],
      guitar7: [
        { id: '07', note: 'B', oct: '1', freq: '61.7' },
        { id: '06', note: 'E', oct: '2', freq: '82.4', active: true },
        { id: '05', note: 'A', oct: '2', freq: '110.0' },
        { id: '04', note: 'D', oct: '3', freq: '146.8' },
        { id: '03', note: 'G', oct: '3', freq: '196.0' },
        { id: '02', note: 'B', oct: '3', freq: '246.9' },
        { id: '01', note: 'E', oct: '4', freq: '329.6' }
      ],
      cello: [
        { id: '04', note: 'C', oct: '2', freq: '65.4', active: true },
        { id: '03', note: 'G', oct: '2', freq: '98.0' },
        { id: '02', note: 'D', oct: '3', freq: '146.8' },
        { id: '01', note: 'A', oct: '3', freq: '220.0' }
      ]
    };

    function renderStrings(list) {
      if (!stringsGrid) return;
      stringsGrid.innerHTML = '';
      const colClass = list.length === 4 ? 'grid-cols-2' : 'grid-cols-3';
      stringsGrid.className = `grid ${colClass} gap-space-xs`;

      list.forEach((item) => {
        const btn = document.createElement('button');
        btn.setAttribute('data-note', item.note + item.oct);
        btn.setAttribute('data-freq', item.freq);
        btn.className = `string-pad flex flex-col justify-between p-space-sm h-20 rounded-xl transition-all active:scale-95 text-left relative overflow-hidden ${
          item.active 
            ? 'bg-secondary-container text-on-secondary-container shadow-[0_0_14px_rgba(133,20,90,0.4)]' 
            : 'bg-surface-container-low text-on-surface hover:bg-surface-container'
        }`;

        btn.innerHTML = `
          <div class="flex items-center justify-between w-full">
            <span class="font-tabular-param text-tabular-param ${item.active ? 'opacity-70' : 'text-outline'}">${item.id}</span>
            <span class="material-symbols-outlined text-[16px] ${item.active ? 'text-secondary animate-pulse' : 'text-outline-variant'}">${item.active ? 'volume_up' : 'graphic_eq'}</span>
          </div>
          <div class="flex items-baseline justify-between w-full">
            <span class="font-headline-sm text-headline-sm font-bold ${item.active ? '' : 'text-on-surface'}">${item.note}<span class="text-[12px] ml-0.5 ${item.active ? '' : 'text-on-surface-variant'}">${item.oct}</span></span>
            <span class="font-tabular-param text-tabular-param ${item.active ? 'opacity-90' : 'text-on-surface-variant'}">${item.freq} Hz</span>
          </div>
          ${item.active ? '<div class="absolute bottom-0 left-0 right-0 h-1 bg-secondary"></div>' : ''}
        `;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.string-pad').forEach(p => {
            p.className = 'string-pad flex flex-col justify-between p-space-sm h-20 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95 text-left relative overflow-hidden';
            const icon = p.querySelector('.material-symbols-outlined');
            if (icon) {
              icon.textContent = 'graphic_eq';
              icon.className = 'material-symbols-outlined text-[16px] text-outline-variant';
            }
            const bottomBar = p.querySelector('.h-1.bg-secondary');
            if (bottomBar) bottomBar.remove();
          });

          btn.className = 'string-pad flex flex-col justify-between p-space-sm h-20 rounded-xl bg-secondary-container text-on-secondary-container shadow-[0_0_14px_rgba(133,20,90,0.4)] transition-all active:scale-95 text-left relative overflow-hidden';
          const icon = btn.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.textContent = 'volume_up';
            icon.className = 'material-symbols-outlined text-[16px] text-secondary animate-pulse';
          }
          const bar = document.createElement('div');
          bar.className = 'absolute bottom-0 left-0 right-0 h-1 bg-secondary';
          btn.appendChild(bar);

          if (detectedNote) detectedNote.textContent = item.note;
          if (detectedOctave) detectedOctave.textContent = item.oct;
          if (detectedFreq) detectedFreq.textContent = `${item.freq} Hz`;

          // Micro fluctuation simulation for live sensation
          const randomDeg = (Math.random() * 4 - 2).toFixed(1);
          if (needleEl) needleEl.style.transform = `rotate(${randomDeg}deg)`;
          if (centOffset) centOffset.textContent = `${randomDeg > 0 ? '+' : ''}${(randomDeg * 3.2).toFixed(1)} cents`;
        });

        stringsGrid.appendChild(btn);
      });
    }

    // Instrument toggles
    const btnGuitar = document.getElementById('btn-inst-guitar');
    const btnCello = document.getElementById('btn-inst-cello');
    const strGroup = document.getElementById('string-count-group');
    const btn6str = document.getElementById('btn-6str');
    const btn7str = document.getElementById('btn-7str');

    btnGuitar?.addEventListener('click', () => {
      btnGuitar.className = 'h-8 px-space-md rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md flex items-center gap-1.5 transition-all shadow-sm';
      btnCello.className = 'h-8 px-space-md rounded-lg text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center gap-1.5 transition-all';
      if (strGroup) strGroup.style.display = 'inline-flex';
      renderStrings(configs.guitar6);
    });

    btnCello?.addEventListener('click', () => {
      btnCello.className = 'h-8 px-space-md rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md flex items-center gap-1.5 transition-all shadow-sm';
      btnGuitar.className = 'h-8 px-space-md rounded-lg text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center gap-1.5 transition-all';
      if (strGroup) strGroup.style.display = 'none';
      renderStrings(configs.cello);
      if (detectedNote) detectedNote.textContent = 'C';
      if (detectedOctave) detectedOctave.textContent = '2';
      if (detectedFreq) detectedFreq.textContent = '65.4 Hz';
    });

    btn6str?.addEventListener('click', () => {
      btn6str.className = 'h-7 px-space-sm rounded-md bg-surface-container-high text-primary font-label-sm text-label-sm font-semibold';
      btn7str.className = 'h-7 px-space-sm rounded-md text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm';
      renderStrings(configs.guitar6);
    });

    btn7str?.addEventListener('click', () => {
      btn7str.className = 'h-7 px-space-sm rounded-md bg-surface-container-high text-primary font-label-sm text-label-sm font-semibold';
      btn6str.className = 'h-7 px-space-sm rounded-md text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm';
      renderStrings(configs.guitar7);
    });

    // Auto vs Ear toggles
    const modeAuto = document.getElementById('mode-auto');
    const modeEar = document.getElementById('mode-ear');
    modeAuto?.addEventListener('click', () => {
      modeAuto.className = 'h-7 px-space-sm rounded-md bg-primary-container text-on-primary-container font-label-sm text-label-sm flex items-center gap-1 shadow-sm';
      modeEar.className = 'h-7 px-space-sm rounded-md text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm flex items-center gap-1';
      if (tuneStatus) tuneStatus.textContent = 'LOCKED';
    });
    modeEar?.addEventListener('click', () => {
      modeEar.className = 'h-7 px-space-sm rounded-md bg-primary-container text-on-primary-container font-label-sm text-label-sm flex items-center gap-1 shadow-sm';
      modeAuto.className = 'h-7 px-space-sm rounded-md text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm flex items-center gap-1';
      if (tuneStatus) tuneStatus.textContent = 'TONE OUT';
    });

    // Calibration Stepper
    document.getElementById('btn-calib-down')?.addEventListener('click', () => {
      calibration = Math.max(420, calibration - 1);
      if (calibValEl) calibValEl.textContent = `A4 = ${calibration} Hz`;
    });
    document.getElementById('btn-calib-up')?.addEventListener('click', () => {
      calibration = Math.min(460, calibration + 1);
      if (calibValEl) calibValEl.textContent = `A4 = ${calibration} Hz`;
    });

    // Live needle float micro-interaction
    setInterval(() => {
      if (!needleEl) return;
      const jitter = (Math.sin(Date.now() / 320) * 1.8).toFixed(2);
      needleEl.style.transform = `rotate(${jitter}deg)`;
    }, 180);
  })();
