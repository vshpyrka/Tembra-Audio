<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=852, initial-scale=1.0">
<title>Tembra Audio - Tuner By Ear (Foldable Open)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0" rel="stylesheet">
<script>
tailwind.config={darkMode:"class",theme:{extend:{colors:{
  "background":"#131316","surface":"#131316","surface-container-lowest":"#0e0e11","surface-container-low":"#1b1b1e",
  "surface-container":"#1f1f22","surface-container-high":"#2a2a2d","surface-container-highest":"#353438",
  "on-surface":"#e4e1e6","on-surface-variant":"#cac4d4","outline":"#948e9d","outline-variant":"#494552",
  "primary":"#cebdff","primary-container":"#a78bfa","on-primary-container":"#3c1989",
  "secondary":"#ffafd3","secondary-container":"#85145a","on-secondary-container":"#ff93c8"},
  fontFamily:{headline:["Space Grotesk"],label:["Space Grotesk"],body:["Inter"]}}}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:852px;height:883px;overflow:hidden}
body{background:#0e0e11;color:#e4e1e6;font-family:'Space Grotesk',sans-serif;position:relative}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}
.material-symbols-outlined.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.rail{position:absolute;left:0;top:0;width:96px;bottom:0;background:#0e0e11;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:97px}
.ritem{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;color:#cac4d4}
.ritem .material-symbols-outlined{font-size:24px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ritem.sel{background:#85145a;color:#ff93c8}
.content{position:absolute;left:96px;top:0;right:0;bottom:0;background:#131316}
.panel{position:absolute;left:111px;width:708px;top:121px;height:704px;border-radius:24px;border:1px solid #1f1a24;
  background:radial-gradient(120% 110% at 50% 50%,#1a1622 0%,#151219 55%,#120e13 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.scard{position:absolute;width:172px;height:172px;background:#0e0e11;border:1px solid #1f1e24;border-radius:16px;padding:14px 13px 16px 13px;display:flex;flex-direction:column;justify-content:space-between}
.roman{font-size:11px;font-weight:500;color:#948e9d;letter-spacing:.02em}
.hz{font-size:11.5px;font-weight:500;color:#cac4d4;letter-spacing:.02em;font-feature-settings:"tnum" 1}
.note{font-size:34px;font-weight:700;line-height:34px;color:#e4e1e6;margin-top:6px}
.note sub{font-size:18px;font-weight:600;color:#cebdff;vertical-align:-6px;margin-left:3px}
.aud{height:35px;width:100%;background:#1f1f22;border:1px solid #2a2a2d;border-radius:10px;color:#e4e1e6;font-family:'Space Grotesk';font-size:12.5px;font-weight:600;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:4px}
.seg{position:absolute;display:flex;border-radius:12px;padding:4px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;font-family:'Space Grotesk';font-size:13px;font-weight:500;letter-spacing:.03em;color:#e4e1e6;background:transparent;border:0}
.seg svg{width:16px;height:16px}
.box{position:absolute;border:1px solid #2a2a2d;background:#1b1b1e;border-radius:14px}
</style>
</head>
<body>
  <nav class="rail" aria-label="Primary" data-purpose="navigation-rail">
      <a class="ritem" href="#" aria-label="Timeline"><span class="material-symbols-outlined">graphic_eq</span></a>
      <a class="ritem sel" href="#" aria-label="Tuner" aria-current="page"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none" data-glyph="tuning_fork"><path d="M9.5 3V10.5A2.5 2.5 0 0 0 14.5 10.5V3"></path><path d="M12 13V21.5"></path><path d="M5.6 4.5A6 6 0 0 0 5.6 10.5"></path><path d="M18.4 4.5A6 6 0 0 1 18.4 10.5"></path></svg></a>
      <a class="ritem" href="#" aria-label="Metronome"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none" data-glyph="metronome"><path d="M15.45 6.05L14.6 3H9.4L4.4 21H19.6L16.56 10.05"></path><path d="M7.34 14H16.66"></path><path d="M12 14L18.6 4.2"></path></svg></a>
      <a class="ritem" href="#" aria-label="Projects"><span class="material-symbols-outlined">folder</span></a>
      <a class="ritem" href="#" aria-label="Profile"><span class="material-symbols-outlined">person</span></a>
  </nav>
  <div class="content"></div>

  <!-- Selector row -->
  <div class="seg" style="left:111px;top:66px;width:165px;height:39px;background:#0e0e11">
    <button style="background:#85145a;color:#ff93c8;font-size:13px">Guitar</button>
    <button>Cello</button>
  </div>
  <div class="seg" style="left:640px;top:70px;width:178px;height:31px;background:#1b1b1e;padding:0;border-radius:9px">
    <button style="flex:1.5;font-size:12px;gap:6px"><span class="material-symbols-outlined" style="font-size:16px">mic</span>Auto Listen</button>
    <button style="background:#a78bfa;color:#3c1989;font-size:12px;border-radius:5px;gap:5px"><span class="material-symbols-outlined" style="font-size:16px">hearing</span>By Ear</button>
  </div>

  <!-- By Ear card -->
  <section class="panel" aria-label="By Ear">
    <div class="seg" style="left:71px;top:23px;width:122px;height:31px;background:#1b1b1e;padding:2px;border-radius:9px">
      <button style="font-size:11.5px;color:#cac4d4">6-String</button>
      <button style="background:#2a2a2d;color:#cebdff;font-size:11.5px;border-radius:7px">7-String</button>
    </div>
    <div class="box flex items-center" style="left:201px;top:16px;width:290px;height:45px;padding:0 14px 0 12px">
      <span class="material-symbols-outlined fill" style="color:#cebdff;font-size:22px">music_note</span>
      <div class="flex flex-col ml-[8px] flex-1 min-w-0">
        <span style="font-size:11px;font-weight:500;letter-spacing:.04em;color:#948e9d;text-transform:uppercase;line-height:14px">Tuning Preset</span>
        <span style="font-size:12.3px;font-weight:500;color:#e4e1e6;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Standard 7-String (B1 E2 A2 D3 G3 B3 E4)</span>
      </div>
      <span class="material-symbols-outlined" style="color:#948e9d;font-size:20px;margin-left:8px">expand_more</span>
    </div>
    <div class="box flex items-center justify-between" style="left:499px;top:11px;width:137px;height:54px;padding:0 16px 0 11px">
      <div class="flex flex-col">
        <span style="font-size:11px;font-weight:600;letter-spacing:.04em;color:#ff93c8;text-transform:uppercase;line-height:14px">Loop Tone</span>
        <span style="font-size:12px;font-weight:500;color:#e4e1e6;line-height:16px">Active</span>
      </div>
      <div style="width:32px;height:16px;border-radius:8px;background:#ffafd3;position:relative"><div style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#f472b6"></div></div>
    </div>
    <div class="scard" style="left:75px;top:78px"><div class="flex justify-between items-start"><span class="roman">VII</span><span class="hz">61.7 Hz</span></div><div class="note">B<sub>1</sub></div><button class="aud"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>Audition</button></div><div class="scard" style="left:267px;top:78px"><div class="flex justify-between items-start"><span class="roman">VI</span><span class="hz">82.4 Hz</span></div><div class="note">E<sub>2</sub></div><button class="aud"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>Audition</button></div><div class="scard" style="left:460px;top:78px"><div class="flex justify-between items-start"><span class="roman">V</span><span class="hz">110.0 Hz</span></div><div class="note">A<sub>2</sub></div><button class="aud"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>Audition</button></div><div class="scard" style="left:75px;top:271px"><div class="flex justify-between items-start"><span class="roman">IV</span><span class="hz">146.8 Hz</span></div><div class="note">D<sub>3</sub></div><button class="aud"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>Audition</button></div><div class="scard" style="left:267px;top:271px"><div class="flex justify-between items-start"><span class="roman">III</span><span class="hz">196.0 Hz</span></div><div class="note">G<sub>3</sub></div><button class="aud"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>Audition</button></div><div class="scard" style="left:460px;top:271px"><div class="flex justify-between items-start"><span class="roman">II</span><span class="hz">246.9 Hz</span></div><div class="note">B<sub>3</sub></div><button class="aud"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>Audition</button></div><div class="scard" style="left:267px;top:464px"><div class="flex justify-between items-start"><span class="roman">I</span><span class="hz">329.6 Hz</span></div><div class="note">E<sub>4</sub></div><button class="aud"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>Audition</button></div>
  </section>
</body></html>
