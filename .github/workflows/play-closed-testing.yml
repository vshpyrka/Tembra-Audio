# Google Play closed testing: every push to main that changes the Android app (a merged pull request, a Renovate merge,
# a direct push) is tested, built, signed with the upload key and released on the closed testing track.
#
# Two jobs, so build code and credentials never meet:
# - build runs Gradle (the host tests and the R8 release bundle) with no credentials at all; the bundle leaves it
#   unsigned.
# - publish never runs Gradle. It authenticates to Google Cloud without any stored key (Workload Identity Federation:
#   GitHub's OIDC token for this workflow on main is exchanged for a short-lived token of the publishing service
#   account), reads the upload key from Secret Manager, signs with the JDK's jarsigner and calls the Play Developer
#   API with app/tools/play/publish.py (standard library only).
#
# One-time setup (Play Console, Google Cloud, the upload key, the repository variables) and the security model:
# docs/google-play-publishing.md, or run app/tools/play/setup-wizard.sh. Until the variables exist, the publish job
# is skipped and a merge only builds and tests.
name: Play closed testing

on:
  push:
    branches: [main]
    # Changes that reach the Android app. Later patterns override earlier ones.
    paths:
      - 'app/**'
      - '!app/**/*.md'
      - '!app/iosApp/**'
      - '!app/perf/**'
      - '!app/perf-benchmarks/**'
      - '!app/tools/**'
      - 'app/tools/play/publish.py'
      - '.github/workflows/play-closed-testing.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Release on the closed testing track. Off: build, test and sign only, and keep the signed bundle as an
          artifact (the first upload, which must go through Play Console by hand).
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time per branch: a newer release run replaces one that has not finished. A build-and-sign-only run
# (publish off) has its own group, so a push to main cannot cancel it.
concurrency:
  group: play-closed-testing-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && 'sign-only' || 'release' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PACKAGE_NAME: audio.tembra.app
  # Zero compiler warnings and no Gradle deprecations, as in CI.
  GRADLE_GATES: -Ptembra.warningsAsErrors=true --warning-mode fail

jobs:
  build:
    name: Test and build the release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version code is the number of commits on main, so the history is needed; blob:none fetches commits
          # and trees only, and the files of this one checkout.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the NDK and CMake the catalog pins
        run: |
          ndk=$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          cmake=$(sed -n 's/^cmake = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          # CI's run of the same push writes the caches; this workflow only reads them.
          cache-read-only: true
      - name: Size Gradle for the runner
        run: printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' 'kotlin.daemon.jvmargs=-Xmx1536m' >> ~/.gradle/gradle.properties
      - name: Version code and release notes
        id: version
        run: |
          code=$(git rev-list --count HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # "What's new" for the testers: a pull request merge gives its title; a local merge its subject and the
          # merged branch's five newest commit subjects; any other commit its subject.
          subject=$(git log -1 --format=%s HEAD)
          body=$(git log -1 --format=%b HEAD | grep -v -E '^(Co-Authored-By|Signed-off-by):' | sed '/^[[:space:]]*$/d' || true)
          if [[ $subject == Merge* && -n $body ]]; then
            notes=$body
          elif [[ $subject == Merge* ]] && git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            notes="$subject"$'\n'"$(git log --no-merges --format='- %s' -n 5 'HEAD^1..HEAD^2')"
          else
            notes=$subject
          fi
          # Play allows 500 characters; the footer stays whole.
          footer="Build $code, commit $(git rev-parse --short HEAD)"
          notes=${notes:0:$((500 - ${#footer} - 2))}
          mkdir -p build/play
          printf '%s\n\n%s\n' "$notes" "$footer" > build/play/release-notes.txt
          echo "Version code $code for $(git rev-parse --short HEAD)"
      - name: Host tests and the release bundle
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # shellcheck disable=SC2086 # GRADLE_GATES is several arguments
          ./gradlew checkAndroidHost :androidApp:bundleRelease -Ptembra.versionCode="$VERSION_CODE" $GRADLE_GATES \
            -Pkotlin.native.ignoreDisabledTargets=true
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab build/play/tembra-audio-unsigned.aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-bundle
          path: app/build/play/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign with the upload key and release on closed testing
    needs: build
    # Skipped until the one-time setup has set the repository variables (docs/google-play-publishing.md), and on any
    # branch but main, which Google Cloud would refuse anyway.
    if: vars.GCP_PLAY_SERVICE_ACCOUNT != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # GitHub's OIDC token for this job, the only credential Workload Identity Federation accepts. Google Cloud admits
      # it only for this repository, on main, from this workflow file (the provider's attribute condition).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: app/tools/play
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          # jarsigner and keytool
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-bundle
          path: ${{ runner.temp }}/play
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          # Play Developer API, and Secret Manager for the upload key.
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher,https://www.googleapis.com/auth/cloud-platform
          access_token_lifetime: 1800s
          # The token goes to the two steps below only, never to a credentials file or the job's environment.
          create_credentials_file: false
          export_environment_variables: false
      - name: Sign with the upload key
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          KEYSTORE_SECRET: ${{ vars.PLAY_UPLOAD_KEYSTORE_SECRET }}
          PASSWORD_SECRET: ${{ vars.PLAY_UPLOAD_PASSWORD_SECRET }}
          UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          python3 app/tools/play/publish.py sign \
            --bundle "$RUNNER_TEMP/play/tembra-audio-unsigned.aab" \
            --out "$RUNNER_TEMP/play/tembra-audio.aab" \
            --keystore-secret "$KEYSTORE_SECRET" \
            --password-secret "$PASSWORD_SECRET" \
            --expect-sha256 "$UPLOAD_CERT_SHA256"
      - name: Release on the closed testing track
        if: github.event_name == 'push' || inputs.publish
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          # The closed testing track's API name: 'alpha' is Play's default closed track.
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
          # 'completed' sends each release to review and then to the testers; 'draft' only saves it in Play Console.
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          PLAY_NOTES_LANGUAGE: ${{ vars.PLAY_NOTES_LANGUAGE || 'en-US' }}
        run: |
          python3 app/tools/play/publish.py publish \
            --package "$PACKAGE_NAME" \
            --track "$PLAY_TRACK" \
            --status "$PLAY_RELEASE_STATUS" \
            --bundle "$RUNNER_TEMP/play/tembra-audio.aab" \
            --notes-file "$RUNNER_TEMP/play/release-notes.txt" \
            --notes-language "$PLAY_NOTES_LANGUAGE"
      - name: Keep the signed bundle for a manual upload
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-bundle
          path: |
            ${{ runner.temp }}/play/tembra-audio.aab
            ${{ runner.temp }}/play/release-notes.txt
          if-no-files-found: error
          retention-days: 3
